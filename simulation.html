<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BandUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.youtube.com/iframe_api" async defer></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:100%;transition:font-size 0.08s linear} /* base for rem scaling — adjusted by JS via font-size adjuster */
  :root{
    --ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#8888aa;
    --paper:#faf9f7;--paper2:#f2f0ec;--paper3:#e8e5df;
    --blue:#002f5f;--blue2:#1a5fa8;--gold:#c8a84b;
    --green:#2e7d4f;--red:#c0392b;--border:rgba(0,0,0,0.1);
    --input-focus:#fff9c4;
    --input-filled-bg:#f5fbf7;--input-active-bg:#f5f9ff;--input-filled-fc-bg:#e8f5e9;
  }
  body.dark-mode{
    --ink:#e8e8f0;--ink2:#b8b8d0;--ink3:#8888aa;
    --paper:#1c1d2b;--paper2:#23243a;--paper3:#33344a;
    --blue:#1a5fa8;--blue2:#3a7fd8;--gold:#d8b85f;
    --green:#4caf6e;--red:#e05858;--border:rgba(255,255,255,0.1);
    --input-focus:#3a3a1c;
    --input-filled-bg:#1f3326;--input-active-bg:#182a3d;--input-filled-fc-bg:#1f3326;
  }
  body.dark-mode{background:#15161f}
  body.dark-mode .q-input,body.dark-mode .fc-inline-input,body.dark-mode .writing-textarea{background:#23243a;color:var(--ink)}
  body.dark-mode .mc-opt{background:#23243a}
  body.dark-mode .timer{background:#2a2a3a;color:#ff8080}
  body.dark-mode .passage{color:var(--ink)}

  /* FONT SIZE CONTROL — slider (5 stops matching FONT_SCALE_STEPS) */
  .font-size-ctrl{display:flex;gap:7px;align-items:center}
  .fs-icon{font-family:'DM Sans',sans-serif;font-weight:700;color:rgba(255,255,255,0.65);line-height:1;user-select:none}
  .fs-icon-sm{font-size:0.68rem}
  .fs-icon-lg{font-size:1rem}
  .fs-slider{
    -webkit-appearance:none;appearance:none;
    width:78px;height:4px;border-radius:2px;
    background:rgba(255,255,255,0.25);
    outline:none;cursor:pointer;margin:0;
  }
  .fs-slider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:15px;height:15px;border-radius:50%;
    background:var(--gold);border:2px solid #fff;
    cursor:pointer;transition:transform 0.1s;
  }
  .fs-slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
  .fs-slider::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;
    background:var(--gold);border:2px solid #fff;
    cursor:pointer;transition:transform 0.1s;
  }
  .fs-slider::-moz-range-thumb:hover{transform:scale(1.15)}
  .fs-slider::-moz-range-track{background:rgba(255,255,255,0.25);height:4px;border-radius:2px}
  body{font-family:'DM Sans',sans-serif;background:var(--paper2);color:var(--ink);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  @media (max-width:900px){
    body{height:auto;min-height:100dvh;overflow:auto}
    .main{min-height:0;height:calc(100dvh - 56px - 52px)}
  }
  .hdr{background:var(--blue);color:#fff;height:40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:16px;padding:0 20px;flex-shrink:0;position:relative}
  .hdr-left{display:flex;align-items:center;gap:14px;justify-self:start;min-width:0;overflow:hidden}
  .hdr-center{justify-self:center}
  .hdr-right{display:flex;align-items:center;gap:10px;justify-self:end}
  .hdr-burger{display:block;background:transparent;border:none;color:#fff;font-size:1.4rem;cursor:pointer;padding:4px 8px;line-height:1}
  /* Dropdown for Tests/Profile links — opened by the burger button, on every screen size */
  .hdr-menu-dropdown{display:none;position:absolute;top:40px;right:20px;flex-direction:column;gap:8px;background:var(--blue);padding:12px;border-radius:0 0 8px 8px;box-shadow:0 8px 20px rgba(0,0,0,0.25);z-index:80;min-width:160px}
  .hdr-menu-dropdown.open{display:flex}
  /* phone: text-size slider + dark mode move into the burger menu (see placeHdrTools()) */
  .hdr-menu-tools{display:flex;flex-direction:column;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.2)}
  .hdr-menu-tools:empty{display:none}
  .hdr-menu-tools .font-size-ctrl{width:100%;gap:10px}
  .hdr-menu-tools .fs-slider{flex:1;width:auto;min-width:0}
  .hdr-menu-tools .btn-profile{width:100%;justify-content:center}
  .dm-label{display:none}
  .hdr-menu-tools .dm-label{display:inline}
  @media(max-width:780px){.hdr-menu-dropdown{right:8px;min-width:230px}}
  /* narrow phones: keep the header's three groups from running into each other */
  @media(max-width:480px){
    .hdr{column-gap:6px;padding:0 10px;grid-template-columns:auto minmax(0,1fr) auto}
    .hdr-center{min-width:0;text-align:center}
    .hdr-center .timer-pending{font-size:0.62rem !important;line-height:1.15;letter-spacing:0.03em !important;white-space:normal}
    .hdr-info-toggle{font-size:0.7rem}
  }
  .hdr-menu-dropdown .btn-profile{width:100%;justify-content:center}
  @media(max-width:900px){
    .hdr-right{gap:8px}
  }
  .hdr-info-toggle{display:none;align-items:center;gap:4px;background:transparent;border:none;color:rgba(255,255,255,0.8);font-size:0.76rem;cursor:pointer;padding:4px 2px;white-space:nowrap;flex-shrink:0}
  .hdr-info-arrow{display:inline-block;font-size:0.68rem;transition:transform 0.2s}
  .hdr-info-toggle.open .hdr-info-arrow{transform:rotate(90deg)}
  .hdr-info-panel{display:flex;align-items:center;gap:14px;min-width:0;overflow:hidden}
  @media(max-width:780px){
    .hdr-left{overflow:visible} /* the info panel below is now absolutely positioned — don't let hdr-left's text-truncation clipping cut it off */
    .hdr-info-toggle{display:inline-flex}
    .hdr-info-panel{position:absolute;top:40px;left:0;right:0;background:var(--blue);padding:4px 20px 14px;box-shadow:0 8px 20px rgba(0,0,0,0.25);z-index:79;flex-direction:column;align-items:flex-start;gap:6px;display:none}
    .hdr-info-panel.open{display:flex}
    .candidate-info{flex-direction:column;align-items:flex-start;gap:4px;white-space:normal}
  }
  .hdr-logo{font-family:'Source Serif 4',serif;font-size:0.95rem;font-weight:600}.hdr-logo span{color:var(--gold)}
  .hdr-badge{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:4px;padding:2px 8px;font-size:0.7rem;color:rgba(255,255,255,0.8);white-space:nowrap}
  .candidate-info{font-size:0.8rem;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:16px;white-space:nowrap;min-width:0;overflow:hidden}
  .candidate-info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .candidate-info b{color:#fff}
  .btn-profile{padding:5px 14px;border:1px solid rgba(255,255,255,0.3);border-radius:5px;color:rgba(255,255,255,0.85);background:transparent;font-size:0.75rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;gap:5px;line-height:1;transition:all 0.15s}
  .btn-profile:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.5)}
  .timer{background:#fff;color:var(--red);border-radius:6px;padding:3px 14px;font-family:monospace;font-size:0.95rem;font-weight:700;letter-spacing:0.05em}
  .timer.warn{background:var(--red);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.85}}
  .main{display:flex;flex:1;overflow:hidden}
  .panel-right{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
  .right-tab-bar{background:var(--blue);border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .rtab-group{display:flex}
  .continue-btn-inline{margin:0 12px;padding:6px 14px;background:var(--gold);color:var(--blue);border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:0.75rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:all 0.15s}
  .continue-btn-inline:hover{opacity:0.85}
  .panel-left{flex:1;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--paper);transition:flex-basis 0.2s}
  .main.compact-left .panel-left{flex:0 0 var(--compact-left-w, 260px);transition:none}
  .main.compact-left .panel-right{flex:1}
  .main.no-left .panel-left{display:none} /* Listening no longer uses the left panel at all — audio controls live inline in the right panel instead */
  .main.no-left .resize-handle{display:none}

  /* ═══ RESIZE HANDLE ═══
     Previously nearly invisible in its idle state (a 3px sliver at 10%
     opacity against a near-identical background). Now given a persistent
     tinted strip + a visible grip glyph so it reads as an affordance
     without hovering first, while still highlighting further on
     hover/drag for clear feedback. */
  .resize-handle{
    width:10px;cursor:col-resize;flex-shrink:0;position:relative;display:none;
    background:rgba(0,47,95,0.05);
  }
  body.dark-mode .resize-handle{background:rgba(255,255,255,0.04)}
  .main.compact-left .resize-handle{display:block}
  .resize-handle:hover,.resize-handle.dragging{background:rgba(200,168,75,0.18)}
  .resize-handle::before{
    content:'⋮';
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:1rem;line-height:1;color:var(--ink3);opacity:0.55;
    letter-spacing:0;pointer-events:none;transition:color 0.15s,opacity 0.15s;
  }
  .resize-handle::after{
    content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:4px;height:44px;background:var(--ink3);opacity:0.35;border-radius:3px;
    transition:background 0.15s,opacity 0.15s;
  }
  .resize-handle:hover::after,.resize-handle.dragging::after{background:var(--gold);opacity:0.9}
  .resize-handle:hover::before,.resize-handle.dragging::before{color:var(--gold);opacity:0.9}
  .resize-handle::before{display:none} /* the ⋮ glyph overlaps the bar oddly at this size — bar alone reads cleanest */

  .rtab{padding:7px 20px;border:none;background:transparent;color:rgba(255,255,255,0.6);font-family:'DM Sans',sans-serif;font-size:0.78rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;position:relative;transition:color 0.2s}
  .rtab:hover{color:rgba(255,255,255,0.9)}.rtab.active{color:#fff}
  .rtab.active::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:3px;background:var(--gold)}
  .rtab.locked-tab{opacity:0.35;cursor:not-allowed;pointer-events:none}
  .rtab.done-tab{opacity:0.55}
  .continue-btn{margin:12px 16px;padding:11px;background:var(--blue2);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;width:calc(100% - 32px);transition:all 0.15s}
  .continue-btn:hover{opacity:0.9}
  .inner-tabs{background:var(--paper2);border-bottom:1px solid var(--border);display:flex;padding:0 16px;flex-shrink:0}
  .inner-tab{padding:9px 16px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
  .inner-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
  .scroll{flex:1;overflow-y:auto;padding:24px}
  .scroll::-webkit-scrollbar{width:4px}.scroll::-webkit-scrollbar-thumb{background:var(--paper3);border-radius:2px}
  .audio-bar-compact{background:var(--paper2);border-bottom:1px solid var(--border);flex-shrink:0}
  .audio-bar-row{display:flex;align-items:center;gap:12px;padding:8px 20px}
  .audio-label{font-family:'Source Serif 4',serif;font-size:0.78rem;color:var(--ink2);margin-bottom:3px}
  .audio-img{width:calc(100% - 40px);height:auto;max-height:320px;object-fit:contain;border-radius:8px;display:none;margin:0 20px 10px}
  .play-ring{width:32px;height:32px;flex-shrink:0;border-radius:50%;border:2px solid var(--blue);background:transparent;color:var(--blue);font-size:0.88rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all 0.2s}
  .play-ring:hover:not(:disabled){background:var(--blue);color:#fff;transform:scale(1.05)}
  .play-ring:disabled{border-color:var(--border);color:var(--ink3);cursor:not-allowed}
  .audio-status{font-size:0.7rem;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;flex-shrink:0}
  .progress-bar{width:100%;height:2px;background:var(--paper3);border-radius:2px;margin-top:4px;overflow:hidden;pointer-events:none}
  .progress-fill{height:100%;background:var(--blue2);width:0%;transition:width 0.3s}
  .passage{font-family:'Source Serif 4',serif;font-size:0.95rem;line-height:1.9;color:var(--ink);padding-bottom:40px}
  .passage h2{font-size:1.15rem;font-weight:600;margin-bottom:14px;color:var(--blue);padding-bottom:10px;border-bottom:1px solid var(--border)}
  .passage p{margin-bottom:14px}
  .prompt-card{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:16px}
  .prompt-card h3{font-family:'Source Serif 4',serif;font-size:1rem;font-weight:600;color:var(--blue);margin-bottom:10px}
  .prompt-card p{font-size:0.88rem;line-height:1.7;color:var(--ink2)}
  .q-section-label{font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--paper3)}
  .q-block{margin-bottom:12px;padding:13px 15px;border-radius:8px;background:var(--paper);border:1px solid var(--border);transition:border-color 0.2s}
  .q-block:focus-within{border-color:var(--blue2);background:var(--paper2)}
  .q-num{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:0.72rem;font-weight:700;text-align:center;line-height:22px;margin-right:8px;flex-shrink:0}
  .q-text{font-size:0.88rem;color:var(--ink);line-height:1.5;display:flex;align-items:flex-start;margin-bottom:8px}
  .q-input{width:100%;padding:7px 12px;border:1px solid var(--paper3);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:0.88rem;color:var(--ink);background:var(--paper);transition:all 0.15s}
  .q-input:focus{outline:none;border-color:var(--blue2);background:var(--input-active-bg)}
  .q-input.filled{border-color:var(--green);background:var(--input-filled-bg)}
  .mc-opts{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .mc-opt{display:flex;align-items:center;gap:10px;padding:7px 12px;border:1px solid var(--paper3);border-radius:6px;cursor:pointer;font-size:0.86rem;transition:all 0.15s;font-family:'DM Sans',sans-serif}
  .mc-opt-thumb{max-width:240px;max-height:180px;border-radius:6px;border:1px solid var(--paper3);display:block;margin-top:6px;object-fit:contain}
  .mc-opt:hover{background:var(--paper);border-color:var(--blue2)}
  .mc-opt.sel{background:#f0f5ff;border-color:var(--blue2);color:var(--blue)}
  .mc-opt input{accent-color:var(--blue)}
  /* Grid layout for image-based MC options — used when at least one option has an image,
     so picture-choice questions lay out side-by-side instead of stacking full-width. */
  .mc-opts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(max-width:600px){.mc-opts-grid{grid-template-columns:1fr}}
  .mc-opts-grid .mc-opt{flex-direction:column;align-items:flex-start;text-align:left}
  .mc-opts-grid .mc-opt-thumb{max-width:100%;width:100%}
  .writing-wrap{display:flex;flex-direction:column;height:100%;padding:20px;gap:12px}
  .writing-textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:10px;padding:16px;font-family:'Source Serif 4',serif;font-size:0.98rem;line-height:1.8;color:var(--ink);background:var(--paper);transition:border-color 0.2s;width:100%}
  .writing-textarea:focus{outline:none;border-color:var(--blue2)}
  .wc-badge{font-size:0.8rem;font-weight:600;color:var(--ink3)}.wc-badge b{color:var(--ink)}
  .wc-progress{width:140px;height:4px;background:var(--paper3);border-radius:2px;overflow:hidden}
  .wc-fill{height:100%;background:var(--blue2);transition:width 0.3s;border-radius:2px}
  .nav-footer{background:var(--blue);padding:8px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;position:sticky;bottom:0;z-index:10}
  .nav-footer.collapsed{padding:6px 16px}
  .nav-footer.collapsed #nav-squares{display:none!important}
  .nav-toggle-btn{background:none;border:1px solid rgba(255,255,255,0.35);color:rgba(255,255,255,0.85);border-radius:5px;padding:3px 8px;font-size:0.7rem;font-weight:600;cursor:pointer;flex-shrink:0}
  .nav-toggle-btn:hover{border-color:#fff;color:#fff}
  .nav-lbl{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.5);text-transform:uppercase;margin-right:4px}
  .nav-sq{width:26px;height:26px;border-radius:4px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);font-size:0.7rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s}
  .nav-sq.done{background:var(--green);border-color:var(--green);color:#fff}
  .section-header{font-size:0.8rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--blue);margin-bottom:16px}
  .instructions-box{margin-top:20px;padding:14px 16px;background:var(--paper2);border-radius:8px;font-size:0.82rem;color:var(--ink3);line-height:1.6;border:1px solid var(--border)}
  .fc-image-wrap{margin-bottom:16px;text-align:center}
  .fc-image-wrap img{max-width:100%;border-radius:8px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
  .fc-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .fc-input-row{display:flex;align-items:center;gap:8px}
  .fc-input-row .q-num{flex-shrink:0}
  .fc-input-row input{flex:1;padding:7px 10px;border:1px solid var(--paper3);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:0.88rem;color:var(--ink);background:var(--paper);transition:all 0.15s}
  .fc-input-row input:focus{outline:none;border-color:var(--blue2);background:var(--input-active-bg)}
  .fc-input-row input.filled{border-color:var(--green);background:var(--input-filled-bg)}
  .matching-options-box{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;background:var(--paper2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:0.85rem;color:var(--ink2)}
  .submit-btn{margin:0 16px 16px;padding:11px;background:var(--green);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;width:calc(100% - 32px);transition:all 0.15s}
  .submit-btn:hover{opacity:0.9}
  #toast-wrap{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{pointer-events:auto;min-width:260px;max-width:min(90vw,420px);padding:12px 16px;border-radius:9px;font-size:0.85rem;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,0.2);display:flex;align-items:center;gap:10px;animation:toastIn 0.25s ease-out;color:#fff}
  .toast.info{background:var(--blue2)}
  .toast.warn{background:#b8860b}
  .toast.danger{background:var(--red)}
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes toastOut{from{opacity:1}to{opacity:0}}
  .btn-nav-next{transition:transform 0.15s cubic-bezier(0.16,1,0.3,1),box-shadow 0.15s ease,background-color 0.2s ease}
  .btn-nav-next:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,0.15)}
  .btn-nav-next:active{transform:translateY(0) scale(0.98)}
  @keyframes gentlePulse{0%,100%{box-shadow:0 0 0 0 rgba(46,125,79,0.4)}50%{box-shadow:0 0 0 6px rgba(46,125,79,0)}}
  .btn-nav-next[style*="1a7a4c"]{animation:gentlePulse 1.8s ease-in-out infinite}
  .nav-sq:hover{transform:scale(1.12)}
  .mc-opt,.q-input,.fc-inline-input{transition:border-color 0.15s ease,background-color 0.15s ease,box-shadow 0.15s ease}

  body.no-animations, body.no-animations *, body.no-animations *::before, body.no-animations *::after{
    animation-duration:0.001s !important; animation-delay:0s !important;
    transition-duration:0.001s !important; transition-delay:0s !important;
  }
  .hidden{display:none!important}
  .content-pre{white-space:pre-wrap;font-family:inherit}
