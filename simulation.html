async function submitTest(autoSubmit){
  // Admin preview: never submit anything — show the "preview finished" screen instead.
  if (window.BANDUP_PREVIEW && BANDUP_PREVIEW.on()) { BANDUP_PREVIEW.finish(); return; }
  // autoSubmit is also used for "already reviewed" — the review modal is the
  // confirmation step now, so a manual submit only reaches here after it.
  try {
    writingVals[curWriting]=document.getElementById('w-textarea').value;

    const candidateData=JSON.parse(sessionStorage.getItem('candidateData')||'{}');
    const wc1 = (writingVals[1]||'').trim().split(/\s+/).filter(Boolean).length;
    const wc2 = (writingVals[2]||'').trim().split(/\s+/).filter(Boolean).length;

    const submission={
      ...candidateData,
      submitTime: new Date().toISOString(),
      testSetID:   activeTestSet.setID   || '',
      testSetName: activeTestSet.setName || '',
      listening: lAnswers,
      reading: rAnswers,
      writing: { task1: writingVals[1], task2: writingVals[2] }
    };

    // Save to Google Sheets — raw answers only, no auto-scoring
    const btn=document.getElementById('submit-btn');
    btn.textContent='Saving...'; btn.disabled=true;
    let sheetsFailed = false;
    let sessionKicked = false;
    let lockedOut = false;
    try {
      const res = await callSheets({
        action:'saveScore',
        candidateID:   candidateData.candidateID||'',
        sessionToken:  candidateData.sessionToken||'',
        fullName:      candidateData.fullName||sessionStorage.getItem('candidateName')||'',
        testSetID:     activeTestSet.setID   || '',
        testSetName:   activeTestSet.setName || '',
        listeningAnswers: JSON.stringify(lAnswers),
        readingAnswers:   JSON.stringify(rAnswers),
        writingTask1WC:wc1, writingTask2WC:wc2,
        writingTask1:  (writingVals[1]||''),
        writingTask2:  (writingVals[2]||'')
      });
      if (res && res.sessionInvalid) {
        sessionKicked = true;
      } else if (res && res.locked) {
        lockedOut = true;
      } else if (!res || !res.success) {
        sheetsFailed = true;
      }
    } catch(e){
      sheetsFailed = true;
    } finally {
      if (lockedOut) {
        showToast('🔒 This test allows only a limited number of attempts and yours are used up, so this one was not saved. Ask your teacher for another attempt.', 'danger', 10000);
        btn.textContent='Not submitted'; btn.disabled=true;
      } else if (sessionKicked) {
        showToast('🚪 Could not submit — your account was logged in on another device. Please log in again.', 'danger', 10000);
        btn.textContent='Not submitted'; btn.disabled=true;
      } else {
        btn.textContent='Submitted ✓'; btn.disabled=true;
      }
    }

    if (lockedOut) {
      setTimeout(() => { window.location.href = 'tests.html'; }, 6000);
      return; // nothing was saved and there is nothing to back up
    }
    if (sessionKicked) {
      setTimeout(() => { window.location.href = 'index.html'; }, 3500);
      return; // skip the backup-download and cleanup below — the finally block above already ran
    }

    // Download JSON backup only if the Sheets save didn't actually succeed —
    // most submissions save fine, so there's no need to surprise every
    // candidate with a download popup on every single submit.
    if (sheetsFailed) {
      try {
        const blob=new Blob([JSON.stringify(submission,null,2)],{type:'application/json'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);
        a.download=`response_${candidateData.candidateID||'unknown'}_${Date.now()}.json`;a.click();
      } catch(e) {
        // Backup download optional — Sheets is the primary record either way.
      }
    }
  } finally {
    // ALWAYS clear the timer, even if something above threw an error —
    // otherwise a failed submission permanently locks the candidate out
    // with a stuck "time's up" state on their next visit to this test.
    clearTimerStorage();
    clearAutosaveStorage();
  }

  if (!autoSubmit) {
    showToast('✅ Answers submitted. Redirecting to sign-in...', 'info', 4000);
  }

  // PRIVACY: multiple candidates commonly share the same computer/kiosk
  // window during an exam session without restarting the app between
  // turns. Without this, the next person to sit down would still see this
  // candidate's filled-in answers on screen and their session data would
  // still be active. Clear everything candidate-specific and force a full
  // page reload (not just a toast) so the next candidate starts from a
  // completely clean login screen.
  sessionStorage.removeItem('candidateData');
  sessionStorage.removeItem('candidateID');
  sessionStorage.removeItem('candidateName');
  sessionStorage.removeItem('selectedTestSet');
  sessionStorage.removeItem('userRole');
  setTimeout(() => { window.location.href = 'index.html'; }, autoSubmit ? 100 : 3000);
}

function escH(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Retake limit: the server is the real gatekeeper (saveDraft/saveScore refuse a locked test); this just
// tells the candidate up front instead of letting them type a whole test that cannot be saved.
async function guardAttemptLimit_(){
  try {
    const cd = JSON.parse(sessionStorage.getItem('candidateData')||'{}');
    const sel = JSON.parse(sessionStorage.getItem('selectedTestSet')||'{}');
    if (!cd.candidateID || !sel.setID) return true;
    const res = await callSheets({ action:'getAttemptStatus', candidateID: cd.candidateID, testSetID: sel.setID });
    if (res && res.success && res.allowed === false) {
      alert('You have already completed this test and have no attempts left.\nAsk your teacher if you need another attempt.');
      window.location.href = 'tests.html';
      return false;
    }
  } catch(e) { /* offline — the server still enforces it on submit */ }
  return true;
}

window.onload = async () => {
  initAccessibilityPrefs(); // apply saved font size / dark mode before anything else renders

  const hasSession = sessionStorage.getItem('candidateName') || sessionStorage.getItem('candidateData');
  if(!hasSession){ window.location.href='index.html'; return; }

  // Must have selected a test from tests.html
  if (!sessionStorage.getItem('selectedTestSet')) {
    window.location.href = 'tests.html'; return;
  }
  if (!(await guardAttemptLimit_())) return;

  try {
    await loadConfig();
  } catch(e) {
    // loadConfig() already catches its own fetch/parse errors, but if
    // something upstream still throws, don't let it strand the page on
    // the loading overlay — fall through and render whatever's cached.
    console.error('loadConfig failed, continuing with cached/empty config:', e);
    hideLoadingOverlay();
  }

  if (activeTestSet.setName) document.getElementById('hdr-badge').textContent = activeTestSet.setName;
  initUser(); // must run before showStartGate()/initTimer() — normalizes candidateID in
              // sessionStorage, which the timer's storage key depends on to avoid session collisions
  showStartGate();
};

// Peeks at localStorage without creating an entry — lets the gate tell a
// fresh start (needs full instructions + acknowledgment) apart from a
// candidate returning mid-test (just needs a "Resume" button).
function hasExistingSession_() {
  try { return !!localStorage.getItem(getTimerStorageKey()); } catch(e) { return false; }
}

function showStartGate() {
  const overlay = document.getElementById('start-gate-overlay');
  const title = (config.meta && config.meta.title) || activeTestSet.setName || 'IELTS Academic Practice Test';

  if (hasExistingSession_()) {
    overlay.innerHTML = `
      <div class="stage-gate">
        <h1>Welcome back</h1>
        <p>You have a test already in progress. Your timer keeps running from where you left off, and your saved answers will be restored.</p>
        <button class="btn" onclick="beginTest()">Resume Test →</button>
      </div>`;
  } else {
    overlay.innerHTML = `
      <div class="stage-gate">
        <h1>${escH(title)}</h1>
        <p><b>Format:</b> Listening (40 questions) → Reading (40 questions) → Writing (2 tasks).</p>
        <p>The Listening audio plays <b>once only</b> and cannot be paused, rewound, or replayed. There is no countdown timer during Listening — once all the audio finishes, you'll get a <b>60-second review window</b> to check your answers, then Reading opens automatically.</p>
        <p>The <b>2-hour countdown</b> covers Reading and Writing together and starts the moment Reading begins. Writing stays hidden until you finish Reading — click "Continue" when you're ready to move forward. Once revealed, you can always go back and review or change earlier answers.</p>
        <p>Your answers are saved automatically as you go, so a lost connection or a refresh won't lose your progress.</p>
        <label class="ack-row">
          <input type="checkbox" id="ack-check" onchange="document.getElementById('start-test-btn').disabled=!this.checked">
          <span>I have read and understood the instructions above, and I'm ready to begin.</span>
        </label>
        <button class="btn" id="start-test-btn" disabled onclick="beginTest()">Start Test →</button>
      </div>`;
  }
  overlay.style.display = 'flex';
}

async function beginTest() {
  document.getElementById('start-gate-overlay').style.display = 'none';

  loadRevealState();
  // The Reading+Writing timer only exists once Reading has actually been
  // reached (see proceedToReadingNow_). A returning candidate who's already
  // past Listening should see it resume immediately; one still in Listening
  // sees the "Listening — untimed" label until the review countdown finishes.
  if (revealed.R) initTimer();
  startAutosaveLoop(); // independent of initTimer() — must run through Listening too, not just Reading/Writing

  loadCompactWidth();
  const localSavedAt = restoreAnswersLocal(); // must run before buildLQs/buildRQs so restored answers render into the inputs
  await restoreAnswersFromServer(localSavedAt); // may overwrite with a newer server-side copy (different device/cleared storage)

  try {
    detectSingleContinuousAudio();
    buildLQs(1);
    buildRQs();
    loadPassages();
    loadWritingPrompts();
    switchLSection(1);
    if (continuousQueue.length > 0) {
      const sections = config.listening && config.listening.sections || [];
      // Resume support: if we have a pending resume point from an interrupted
      // session (accidental close, crash, etc.), jump straight to that queue
      // item instead of the first one — playAudio() will seek to the saved
      // timestamp once playback starts. Candidates still can't rewind/replay
      // anything they'd already finished before the interruption.
      if (pendingAudioResume && pendingAudioResume.queuePos < continuousQueue.length) {
        queuePos = pendingAudioResume.queuePos;
        audioSeekOnPlay = pendingAudioResume.time || 0;
      }
      const firstItem = continuousQueue[queuePos];
      loadAudioForSection(sections[firstItem.idx], firstItem.idx + 1);
      if (audioSeekOnPlay > 0) {
        document.getElementById('audio-status').innerText = 'Resuming from where you left off — click Play';
      }
    } else if (!revealed.R) {
      // No Listening audio configured at all — don't leave the candidate
      // stuck waiting on an 'ended' event that will never fire. Same forced
      // review-then-proceed path, just triggered directly.
      const status = document.getElementById('audio-status');
      if (status) status.innerText = 'No audio for this section';
      showToast('⚠️ No Listening audio found for this test — proceeding to a short review before Reading.', 'warn');
      startListeningReviewCountdown_();
    }
  } catch(e) {
    // If a bad/partial config makes any of the above throw, the audio
    // panel and question panels must still reach a usable state instead
    // of freezing on "Loading..." forever.
    console.error('Section init failed:', e);
    const status = document.getElementById('audio-status');
    if (status) status.innerText = 'No audio for this section';
  }
  switchSection('L');
  try { toggleNavFooter(localStorage.getItem('ielts_nav_collapsed')==='1'); } catch(e) {}
}
</script>
<script>
/* ---- Anti-translation guard ----
   Page already opts out of translation (translate="no"). Some browsers/extensions ignore that,
   so this detects a translation, forces the page back to English, and warns the candidate. */
(function(){
  var handling = false;
  function isTranslated(){
    var h = document.documentElement;
    return /translated-(ltr|rtl)/.test(h.className) ||
           /translated-(ltr|rtl)/.test(document.body ? document.body.className : '') ||
           (h.getAttribute('lang') || 'en').toLowerCase().indexOf('en') !== 0 ||
           !!document.querySelector('font[style*="vertical-align: inherit"], #google_translate_element, .goog-te-banner-frame, iframe.skiptranslate');
  }
  function showBlocker(){
    if (document.getElementById('translate-blocker')) return;
    var d = document.createElement('div');
    d.id = 'translate-blocker';
    d.setAttribute('translate','no');
    d.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(10,12,30,.92);display:flex;align-items:center;justify-content:center;padding:24px;font-family:DM Sans,sans-serif';
    d.innerHTML = '<div style="background:#fff;color:#1a1a2e;max-width:460px;border-radius:12px;padding:28px;text-align:center;line-height:1.5">'
      + '<h2 style="margin-bottom:10px;color:#002f5f">Translation detected</h2>'
      + '<p style="margin-bottom:16px">This test must be taken in English. Please turn off your browser\u2019s translation for this page (use the translate icon in the address bar and choose \u201CShow original\u201D / \u201CNever translate this site\u201D), then press the button below.</p>'
      + '<button id="translate-reload-btn" style="background:#002f5f;color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:1rem;cursor:pointer">Reload in English</button>'
      + '<p style="margin-top:12px;font-size:.8rem;color:#666">Your answers and timer are saved.</p></div>';
    document.body.appendChild(d);
    document.getElementById('translate-reload-btn').onclick = function(){ location.reload(); };
  }
  function revert(){
    if (handling) return; handling = true;
    try { if (typeof saveAnswersLocal === 'function') saveAnswersLocal(); } catch(e){}
    var h = document.documentElement;
    h.setAttribute('lang','en');
    h.className = h.className.replace(/\btranslated-(ltr|rtl)\b/g,'').trim();
    if (document.body) document.body.className = document.body.className.replace(/\btranslated-(ltr|rtl)\b/g,'').trim();
    // One automatic reload per session to bring the original English text back;
    // if translation keeps coming back, block the page and explain how to turn it off.
    var tried = sessionStorage.getItem('translateReloadAt');
    if (!tried || Date.now() - Number(tried) > 60000) {
      sessionStorage.setItem('translateReloadAt', String(Date.now()));
      location.reload();
    } else {
      showBlocker();
      setTimeout(function(){ handling = false; }, 1500);
    }
  }
  function check(){ if (!handling && isTranslated()) revert(); }
  new MutationObserver(check).observe(document.documentElement, { attributes:true, attributeFilter:['lang','class'], childList:true, subtree:true });
  setInterval(check, 2000);
  window.addEventListener('load', check);
})();
</script>
