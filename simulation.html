<script>
let timerInterval = null; // Reading+Writing countdown handle (cleared if the session is taken over)
let cur='L', curLSec=1, curPassage=1;
let audioPlayed=[false,false,false,false];
let writingVals={1:'',2:''};
let curWriting=1;
let answered={L:{},R:{}};
let lAnswers={}, rAnswers={};
let timeLeft=9900;
let config={};
let activeTestSet={ setID:'', setName:'' };

// ══════════════════════════════════════
// ACCESSIBILITY — FONT SIZE & DARK MODE
// Preferences persist across the whole site via localStorage so they
// carry over between index/profile/tests/simulation pages.
// ══════════════════════════════════════
const FONT_SCALE_MIN = 85, FONT_SCALE_MAX = 145; // percent — matches slider min/max
let fontScalePct = 100; // default = 100%

function initAccessibilityPrefs() {
  // Font size
  const savedScale = parseInt(localStorage.getItem('ielts_font_scale'));
  if (!isNaN(savedScale) && savedScale >= FONT_SCALE_MIN && savedScale <= FONT_SCALE_MAX) {
    fontScalePct = savedScale;
  }
  applyFontScale();
  const slider = document.getElementById('fs-slider');
  if (slider) slider.value = fontScalePct; // reflect restored preference on the handle position

  // Dark mode
  const darkOn = localStorage.getItem('ielts_dark_mode') === '1';
  if (darkOn) {
    document.body.classList.add('dark-mode');
    const dmIcon = document.getElementById('dm-icon');
    if (dmIcon) dmIcon.textContent = '☀️';
  }

  // Animations — no dedicated toggle button on the exam screen itself (to
  // avoid clutter during the actual test), but it respects whatever the
  // candidate set on the login/profile/tests pages.
  if (localStorage.getItem('ielts_animations_off') === '1') {
    document.body.classList.add('no-animations');
  }
}

function applyFontScale() {
  document.documentElement.style.fontSize = fontScalePct + '%';
  localStorage.setItem('ielts_font_scale', fontScalePct);
}

function toggleHdrMenu(){
  document.getElementById('hdr-menu-dropdown').classList.toggle('open');
}
function toggleHdrInfo(){
  document.getElementById('hdr-info-panel').classList.toggle('open');
  document.getElementById('hdr-info-toggle').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const menu = document.getElementById('hdr-menu-dropdown');
  const burger = document.querySelector('.hdr-burger');
  if (menu && menu.classList.contains('open') && !menu.contains(e.target) && e.target !== burger) {
    menu.classList.remove('open');
  }
  const infoPanel = document.getElementById('hdr-info-panel');
  const infoToggle = document.getElementById('hdr-info-toggle');
  if (infoPanel && infoPanel.classList.contains('open') && !infoPanel.contains(e.target) && !infoToggle.contains(e.target)) {
    infoPanel.classList.remove('open');
    infoToggle.classList.remove('open');
  }
});
// Called on every drag of the font-size slider — value is the percentage itself (85-145),
// so the handle moves in smooth 1% increments instead of snapping between a few big steps.
function setFontSize(pct) {
  const val = parseInt(pct, 10);
  if (isNaN(val) || val < FONT_SCALE_MIN || val > FONT_SCALE_MAX) return;
  fontScalePct = val;
  applyFontScale();
}

function toggleDarkMode() {
  const isDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('ielts_dark_mode', isDark ? '1' : '0');
  const dmIcon = document.getElementById('dm-icon');
  if (dmIcon) dmIcon.textContent = isDark ? '☀️' : '🌙';
}

// On phones the header has no room for the text-size slider and the dark-mode button, so they live inside the
// burger menu there. The very same elements are moved (not copied), so their handlers and saved settings keep working.
function placeHdrTools() {
  const phone = window.matchMedia('(max-width:780px)').matches;
  const tools = document.getElementById('hdr-menu-tools');
  const right = document.querySelector('.hdr-right');
  const fs = document.querySelector('.font-size-ctrl');
  const dm = document.getElementById('dark-mode-toggle');
  const burger = document.querySelector('.hdr-burger');
  if (!tools || !right || !fs || !dm || !burger) return;
  if (phone) { tools.appendChild(fs); tools.appendChild(dm); }
  else { right.insertBefore(fs, burger); right.insertBefore(dm, burger); }
}
window.addEventListener('resize', placeHdrTools);
window.addEventListener('orientationchange', placeHdrTools);
document.addEventListener('DOMContentLoaded', placeHdrTools);

// ══════════════════════════════════════
// UNIFIED AUDIO PLAYER
// Both YouTube and direct MP3 audio go through this single custom
// player — no native controls are ever exposed, so candidates can't
// drag/click the seek bar to skip or replay parts of the recording.
// ══════════════════════════════════════
let ytPlayer = null;
let ytReady = false;
let ytPendingVideoId = null;
let currentAudioMode = 'none'; // 'none' | 'file' | 'youtube'
let progressInterval = null;
let isSingleContinuousAudio = false; // true when all 4 sections share the same audio URL
// continuousQueue holds every section's audio track in order (1 entry per
// distinct, consecutive URL — identical back-to-back URLs collapse into one
// entry so a "same link pasted in all 4 sections" setup still plays once).
// Once playback starts, section-tab navigation never touches the player —
// it just keeps playing through the queue and auto-advances on end.
let continuousQueue = [];
let queuePos = 0;
let audioSessionStarted = false;

function onYouTubeIframeAPIReady() {
  ytReady = true;
  ytPlayer = new YT.Player('yt-player-target', {
    height: '1', width: '1',
    playerVars: { controls: 0, disablekb: 1, fs: 0, modestbranding: 1, rel: 0, iv_load_policy: 3 },
    events: {
      onReady: () => { if (ytPendingVideoId) { ytPlayer.cueVideoById(ytPendingVideoId); ytPendingVideoId = null; } },
      onStateChange: onYTStateChange
    }
  });
}

function onYTStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) {
    onAudioEnd();
  }
}

function extractYouTubeId(url) {
  if (!url) return null;
  let id = null;
  if (url.includes('watch?v=')) id = url.split('watch?v=')[1].split('&')[0];
  else if (url.includes('youtu.be/')) id = url.split('youtu.be/')[1].split('?')[0];
  else if (url.includes('/embed/')) id = url.split('/embed/')[1].split('?')[0];
  return id;
}

// A raw Google Drive "share" link (…/file/d/ID/view?usp=sharing) is an HTML
// preview page, not a media stream — <audio src> can't play it. Convert it
// to the direct-download form here too, as a safety net for any section
// audioURL saved before question-maker.html started converting these itself.
function resolvePlayableAudioURL(url) {
  if (!url) return url;
  if (url.includes('export=download') || url.includes('uc?id=')) return url;
  // raw.githubusercontent.com always serves files as Content-Type:
  // application/octet-stream, regardless of extension — browsers refuse to
  // play that in an <audio> element even though the bytes are a valid mp3.
  // jsDelivr mirrors the same GitHub content but serves the correct
  // audio/* type, so rewrite to that instead.
  if (url.includes('raw.githubusercontent.com')) {
    const m = url.match(/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\/(.+)/);
    if (m) {
      const [, user, repo, ref, path] = m;
      return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${ref}/${path}`;
    }
  }
  if (!url.includes('drive.google.com')) return url;
  const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return match ? `https://drive.google.com/uc?export=download&id=${match[1]}` : url;
}

// Load config from localStorage (set by admin)
// ══════════════════════════════════════
// CONFIG LOADER — tries Google Drive first, falls back to localStorage
// ══════════════════════════════════════
async function loadConfig() {
  // Priority 1: Test set selected on tests.html (this session)
  const selected = sessionStorage.getItem('selectedTestSet');
  let driveURL = '';
  if (selected) {
    try {
      const sel = JSON.parse(selected);
      driveURL = sel.configURL || '';
      activeTestSet = { setID: sel.setID || '', setName: sel.setName || '' };
    } catch(e) {}
  }

  // Load cached config from localStorage first (instant, avoids blank screen)
  const local = localStorage.getItem('ielts_admin_config');
  if (local) { try { config = JSON.parse(local); } catch(e){ config={}; } }

  // Priority 2: fall back to previously-active Drive URL if nothing selected
  if (!driveURL) {
    driveURL = (config && config._driveURL) || localStorage.getItem('ielts_drive_url') || '';
  }

  if (!driveURL) return; // No URL available — use cached config

  try {
    showLoadingOverlay('Loading test configuration...');
    const fresh = await fetchDriveConfig(driveURL);
    if (fresh) {
      config = fresh;
      localStorage.setItem('ielts_admin_config', JSON.stringify(config));
      if (config._driveURL) localStorage.setItem('ielts_drive_url', config._driveURL);
    }
  } catch(e) {
    console.warn('Config fetch failed, using cached config:', e.message);
  } finally {
    hideLoadingOverlay();
  }
}

function convertDriveURL(url) {
  if (!url) return '';
  if (url.includes('export=download') || url.includes('uc?id=')) return url;
  const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match) return `https://drive.google.com/uc?export=download&id=${match[1]}`;
  return url;
}

async function fetchDriveConfig(url) {
  // GitHub raw URLs & most direct JSON URLs work fine with fetch (no CORS)
  try {
    // Without a timeout, a slow/dead connection leaves this fetch pending
    // forever — since window.onload awaits loadConfig() before anything
    // else (including rendering the audio player status), a hung fetch
    // here freezes the whole test screen on "Loading...", audio included.
    const ctrl = new AbortController();
    const timeoutId = setTimeout(() => ctrl.abort(), 8000);
    let res;
    try {
      res = await fetch(url, { cache:'no-cache', signal: ctrl.signal });
    } finally {
      clearTimeout(timeoutId);
    }
    if (res.ok) {
      const text = await res.text();
      return JSON.parse(text);
    }
    throw new Error('HTTP ' + res.status);
  } catch(e) {
    throw e;
  }
}

function showLoadingOverlay(msg) {
  let ov = document.getElementById('load-overlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'load-overlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,47,95,0.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:"DM Sans",sans-serif;gap:14px';
    ov.innerHTML = `
      <div style="width:44px;height:44px;border:3px solid rgba(255,255,255,0.25);border-top-color:#c8a84b;border-radius:50%;animation:spin 0.7s linear infinite"></div>
      <div style="font-family:'Source Serif 4',serif;font-size:1.3rem;font-weight:600;color:#c8a84b">BandUp</div>
      <div id="load-msg" style="font-size:0.85rem;opacity:0.75;letter-spacing:0.03em"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
    document.body.appendChild(ov);
  }
  document.getElementById('load-msg').textContent = msg;
  ov.style.display = 'flex';
}
function hideLoadingOverlay() {
  const ov = document.getElementById('load-overlay');
  if (ov) ov.style.display = 'none';
}

function initUser() {
  // Try candidateData object first (most complete), fallback to individual keys
  let name = sessionStorage.getItem('candidateName') || '';
  let id   = sessionStorage.getItem('candidateID')   || '';
  const raw = sessionStorage.getItem('candidateData');
  if (raw) {
    try {
      const cd = JSON.parse(raw);
      name = cd.fullName    || name;
      id   = cd.candidateID || id;
      // Re-set to ensure consistency
      sessionStorage.setItem('candidateName', name);
      sessionStorage.setItem('candidateID',   id);
    } catch(e) {}
  }
  document.getElementById('disp-name').innerText = name || 'Guest';
  document.getElementById('disp-id').innerText   = id   || 'N/A';
}

// ══════════════════════════════════════
// PERSISTENT TIMER — survives refresh/logout
// Covers Reading + Writing only. Listening has no visible countdown at
// all — the candidate just listens through to the end, gets a forced
// 60-second review window, and is then moved into Reading, at which point
// this timer is created and starts ticking for the first time.
const TEST_DURATION_SECONDS = 7200; // 2:00:00 — Reading + Writing combined

// ══════════════════════════════════════
// TOASTS — non-blocking notifications (time reminders, connection issues, etc.)
// Unlike alert(), these don't freeze JS/audio playback while shown.
// ══════════════════════════════════════
function showToast(msg, variant, duration) {
  const wrap = document.getElementById('toast-wrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (variant || 'info');
  el.innerHTML = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut 0.3s ease-in forwards';
    setTimeout(() => el.remove(), 300);
  }, duration || 6000);
}

// Fires once per threshold as the timer crosses it — tracks which have
// already fired so a slow/throttled tick (backgrounded tab) can't skip or
// repeat a warning. Checked every tick against the wall-clock-derived
// timeLeft, not a simple counter, so it stays correct even after skips.
const _firedTimeWarnings = new Set();
function checkTimeWarnings(timeLeftNow) {
  const elapsed = TEST_DURATION_SECONDS - timeLeftNow;

  // "Every 1hr past" — fires at each full hour of elapsed time
  for (let h = 1; h * 3600 <= TEST_DURATION_SECONDS; h++) {
    const mark = h * 3600;
    if (elapsed >= mark && !_firedTimeWarnings.has('elapsed' + mark)) {
      _firedTimeWarnings.add('elapsed' + mark);
      showToast(`⏱️ ${h} hour${h>1?'s':''} have passed.`, 'info');
    }
  }

  if (timeLeftNow <= 1800 && !_firedTimeWarnings.has('remain1800')) {
    _firedTimeWarnings.add('remain1800');
    showToast('⚠️ 30 minutes remaining.', 'warn');
  }
  if (timeLeftNow <= 300 && !_firedTimeWarnings.has('remain300')) {
    _firedTimeWarnings.add('remain300');
    showToast('🔴 Final 5 minutes! Please finish and review your answers.', 'danger', 9000);
  }
}

function getTimerStorageKey() {
  const cid = sessionStorage.getItem('candidateID') || 'guest';
  const sid = (activeTestSet && activeTestSet.setID) || 'default';
  return `ielts_timer_end_${cid}_${sid}`;
}

function initTimer() {
  const key = getTimerStorageKey();
  let endTime = localStorage.getItem(key);

  if (!endTime) {
    // First time entering Reading — start the clock now
    endTime = Date.now() + TEST_DURATION_SECONDS * 1000;
    localStorage.setItem(key, String(endTime));
  } else {
    endTime = parseInt(endTime);
  }

  timeLeft = Math.max(0, Math.round((endTime - Date.now()) / 1000));

  // Reveal the real countdown now that Reading has actually begun — until
  // this point the header just shows "Listening — untimed".
  const pendingEl = document.getElementById('timer-pending');
  if (pendingEl) pendingEl.style.display = 'none';

  // Render immediately so display isn't stale on first tick
  const timerEl = document.getElementById('timer');
  timerEl.style.display = 'block';
  function renderTimer() {
    let h=Math.floor(timeLeft/3600),m=Math.floor((timeLeft%3600)/60),s=timeLeft%60;
    timerEl.innerText=`${h}:${m<10?'0':''}${m}:${s<10?'0':''}${s}`;
    if(timeLeft<=600)timerEl.className='timer warn';
  }
  renderTimer();
  // Evaluate the Continue-button gate immediately too, in case a returning
  // candidate reloads the page after Reading was already unlocked.
  renderTabLocks();

  timerInterval = setInterval(()=>{
    if(timeLeft<=0){ timerEl.innerText='0:00:00'; autoSubmitOnTimeUp(); return; }
    timeLeft--;
    renderTimer();
    checkTimeWarnings(timeLeft);
    renderTabLocks();
    if(timeLeft<=0){ timerEl.innerText='0:00:00'; autoSubmitOnTimeUp(); }
  },1000);
}

// Autosave / draft-sync loop — deliberately SEPARATE from initTimer()'s
// countdown interval. initTimer() only starts once Reading begins, but
// candidates are answering (and need backing up) all the way through
// Listening too, so this has to run from the moment the test actually
// starts, independent of whether the Reading+Writing clock exists yet.
function startAutosaveLoop() {
  let tickCount = 0;
  // Stagger periodic Sheets syncs across candidates — if a whole batch starts
  // their test within the same minute, everyone's "every 90s" would otherwise
  // land on the exact same tick and hit the server simultaneously. Each
  // browser gets a fixed random offset (0-29s) so syncs spread out instead.
  const syncJitter = getSyncJitter_();
  setInterval(()=>{
    tickCount++;
    if (tickCount % 3 === 0) saveAnswersLocal();       // every ~3s — instant local backup
    if (tickCount % 90 === syncJitter) syncDraftToSheets(); // every ~90s, staggered — offsite backup, throttled for quota
  },1000);
}

function getSyncJitter_() {
  const key = 'ielts_sync_jitter';
  let j = localStorage.getItem(key);
  if (j === null) {
    j = Math.floor(Math.random() * 30); // stable per browser/device, not per session
    localStorage.setItem(key, String(j));
  }
  return parseInt(j, 10);
}

function clearTimerStorage() {
  try { localStorage.removeItem(getTimerStorageKey()); } catch(e) {}
}

// ══════════════════════════════════════
// AUTOSAVE — Layer 1: instant local backup (survives refresh/crash)
//            Layer 2: periodic backup to Google Sheets (survives device loss)
// ══════════════════════════════════════
function getRevealStorageKey() {
  const cid = sessionStorage.getItem('candidateID') || 'guest';
  const sid = (activeTestSet && activeTestSet.setID) || 'default';
  return `ielts_revealed_${cid}_${sid}`;
}

// Anti-peeking gate: Reading/Writing content stays hidden until the
// candidate finishes Listening (then Writing until Reading is finished).
// Once revealed, a section STAYS revealed — the candidate can freely go
// back to review/change earlier answers. This only blocks *looking ahead*.
let revealed = { L: true, R: false, W: false };
function loadRevealState() {
  try {
    const raw = localStorage.getItem(getRevealStorageKey());
    if (raw) revealed = Object.assign(revealed, JSON.parse(raw));
  } catch(e) {}
}
function saveRevealState() {
  try { localStorage.setItem(getRevealStorageKey(), JSON.stringify(revealed)); } catch(e) {}
}

// ══════════════════════════════════════
// RESIZABLE LEFT PANEL (Listening only) — candidate drags the handle to
// pick their own audio-panel width; choice is remembered for next time.
// ══════════════════════════════════════
let compactLeftWidth = 260;
let resizing = false;

function loadCompactWidth() {
  try {
    const v = parseInt(localStorage.getItem('ielts_left_panel_width'), 10);
    if (v && v >= 160 && v <= 640) compactLeftWidth = v;
  } catch(e) {}
  applyCompactWidth();
}
function applyCompactWidth() {
  document.documentElement.style.setProperty('--compact-left-w', compactLeftWidth + 'px');
}

function startResize(e) {
  if (!document.querySelector('.main').classList.contains('compact-left')) return;
  resizing = true;
  document.getElementById('resize-handle').classList.add('dragging');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'col-resize';
  window.addEventListener('mousemove', onResizeMove);
  window.addEventListener('mouseup', stopResize);
  window.addEventListener('touchmove', onResizeMoveTouch, { passive: false });
  window.addEventListener('touchend', stopResize);
  e.preventDefault();
}
function onResizeMove(e) { doResize(e.clientX); }
function onResizeMoveTouch(e) {
  const t = e.touches[0];
  if (!t) return;
  e.preventDefault();
  doResize(t.clientX);
}
function doResize(clientX) {
  if (!resizing) return;
  const mainRect = document.querySelector('.main').getBoundingClientRect();
  let w = clientX - mainRect.left;
  w = Math.max(160, Math.min(640, w));
  compactLeftWidth = w;
  applyCompactWidth();
}
function stopResize() {
  if (!resizing) return;
  resizing = false;
  document.getElementById('resize-handle').classList.remove('dragging');
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
  window.removeEventListener('mousemove', onResizeMove);
  window.removeEventListener('mouseup', stopResize);
  window.removeEventListener('touchmove', onResizeMoveTouch);
  window.removeEventListener('touchend', stopResize);
  try { localStorage.setItem('ielts_left_panel_width', String(Math.round(compactLeftWidth))); } catch(e) {}
}
function resetCompactWidth() {
  compactLeftWidth = 260;
  applyCompactWidth();
  try { localStorage.setItem('ielts_left_panel_width', '260'); } catch(e) {}
  showToast('↩️ Panel width reset to default.', 'info', 2500);
}

function renderTabLocks() {
  document.getElementById('tab-R').classList.toggle('locked-tab', !revealed.R);
  document.getElementById('tab-W').classList.toggle('locked-tab', !revealed.W);

  // Listening → Reading is now fully automatic (forced via the post-audio
  // review countdown, see startListeningReviewCountdown_ / proceedToReadingNow_)
  // — there's no manual button for it anymore. Reading → Writing is still a
  // manual "Continue" click, available as soon as Reading is reached.
  const showContinue = (cur === 'R' && !revealed.W);

  document.getElementById('continue-btn').style.display = showContinue ? 'inline-block' : 'none';
  document.getElementById('continue-btn').innerText = 'Done — Continue to Writing →';
}

function continueToNextSection() {
  if (cur === 'R' && !revealed.W) {
    revealed.W = true;
    saveRevealState();
    showToast('✍️ Writing section unlocked.', 'info');
    switchSection('W');
  }
}

function getAutosaveStorageKey() {
  const cid = sessionStorage.getItem('candidateID') || 'guest';
  const sid = (activeTestSet && activeTestSet.setID) || 'default';
  return `ielts_draft_${cid}_${sid}`;
}

let lastSyncedSnapshot = ''; // used to skip Sheets sync when nothing changed

// Audio resume state: tracked continuously during playback (see updateProgress),
// persisted alongside the answers autosave, and applied once on load so an
// accidental window close doesn't force the candidate to start the listening
// track over from 0:00 — they resume exactly where they left off (they still
// can't rewind/replay anything earlier, same exam-integrity rule as before).
let audioPlaybackState = { queuePos: 0, time: 0, started: false };
let pendingAudioResume = null;
let audioSeekOnPlay = 0; // seconds to jump to the moment playback starts, for resume

function saveAnswersLocal() {
  try {
    localStorage.setItem(getAutosaveStorageKey(), JSON.stringify({ lAnswers, rAnswers, writingVals, audio: audioPlaybackState, savedAt: Date.now() }));
  } catch(e) { /* storage full/unavailable — Layer 2 sync still runs on its own timer */ }
}

function restoreAnswersLocal() {
  try {
    const raw = localStorage.getItem(getAutosaveStorageKey());
    if (!raw) return 0;
    const draft = JSON.parse(raw);
    if (draft.lAnswers) Object.assign(lAnswers, draft.lAnswers);
    if (draft.rAnswers) Object.assign(rAnswers, draft.rAnswers);
    if (draft.writingVals) Object.assign(writingVals, draft.writingVals);
    if (draft.audio && draft.audio.started) pendingAudioResume = draft.audio;
    return draft.savedAt || 0;
  } catch(e) { return 0; /* corrupted draft — ignore, candidate starts blank */ }
}

// Restore-on-login (Layer 3): pulls the server-side draft (synced every ~90s
// during a previous session) and uses it if it's newer than whatever's in
// local storage — covers a candidate resuming on a different device/browser,
// or one whose local storage got cleared mid-test.
async function restoreAnswersFromServer(localSavedAt) {
  const candidateData = JSON.parse(sessionStorage.getItem('candidateData') || '{}');
  const candidateID = candidateData.candidateID || sessionStorage.getItem('candidateID') || '';
  if (!candidateID || !activeTestSet.setID) return;
  try {
    const res = await callSheets({ action: 'getDraft', candidateID, testSetID: activeTestSet.setID });
    if (!res || !res.success || !res.found) return;
    if (res.status === 'submitted') return; // previous attempt was already handed in — start fresh
    const serverTime = res.updatedAt ? new Date(res.updatedAt).getTime() : 0;
    if (serverTime <= (localSavedAt || 0)) return; // local copy is already newer/equal
    Object.assign(lAnswers, JSON.parse(res.lAnswers || '{}'));
    Object.assign(rAnswers, JSON.parse(res.rAnswers || '{}'));
    const serverWriting = JSON.parse(res.writingVals || '{}');
    if (serverWriting._audio) { pendingAudioResume = serverWriting._audio; delete serverWriting._audio; }
    Object.assign(writingVals, serverWriting);
  } catch(e) { /* offline/quota — local copy (if any) still stands */ }
}

function clearAutosaveStorage() {
  try { localStorage.removeItem(getAutosaveStorageKey()); } catch(e) {}
}

// Forced logout when another device has taken over this account's session.
// Called from any callSheets response that comes back with sessionInvalid.
function handleSessionInvalid_() {
  if (window._sessionKickedOut) return;
  window._sessionKickedOut = true;
  clearInterval(timerInterval);
  showToast('🚪 Signed out — your account was logged in on another device.', 'danger', 10000);
  setTimeout(() => { window.location.href = 'index.html'; }, 3500);
}

const sleep_ = (ms) => new Promise(resolve => setTimeout(resolve, ms));

// tickCount%90===syncJitter already spreads everyone's 90s sync across a
// stable 0-29s per-browser offset, so a whole batch starting together
// doesn't all land on the same second. What that stagger can't prevent is
// the LockService itself being busy (another candidate's write is mid-flight
// right when this one fires) — saveDraft then comes back with
// success:false + "Server is busy...". Retry that case a few times with a
// short randomized backoff instead of silently marking it as synced.
async function syncDraftToSheets(attempt) {
  attempt = attempt || 0;

  // capture the current writing textarea too, since it isn't written into
  // writingVals until the user switches tasks or submits
  const ta = document.getElementById('w-textarea');
  if (ta) writingVals[curWriting] = ta.value;

  const snapshot = JSON.stringify({ lAnswers, rAnswers, writingVals, cur, audio: audioPlaybackState });
  if (attempt === 0 && snapshot === lastSyncedSnapshot) return; // nothing new — save the Apps Script quota

  const candidateData = JSON.parse(sessionStorage.getItem('candidateData') || '{}');
  const writingValsOut = Object.assign({}, writingVals, { _audio: audioPlaybackState });
  try {
    const res = await callSheets({
      action: 'saveDraft',
      examType: 'IELTS',
      currentSection: cur,
      candidateID: candidateData.candidateID || sessionStorage.getItem('candidateID') || '',
      fullName:    candidateData.fullName || sessionStorage.getItem('candidateName') || '',
      testSetID:   activeTestSet.setID   || '',
      testSetName: activeTestSet.setName || '',
      sessionToken: candidateData.sessionToken || '',
      lAnswers: JSON.stringify(lAnswers),
      rAnswers: JSON.stringify(rAnswers),
      writingVals: JSON.stringify(writingValsOut),
      listeningAnswers: JSON.stringify(lAnswers),
      readingAnswers:   JSON.stringify(rAnswers),
      writingTask1: (writingVals[1]||''),
      writingTask2: (writingVals[2]||'')
    });

    if (res && res.sessionInvalid) { handleSessionInvalid_(); return; }
    if (res && res.locked) return; // attempts used up — nothing more to autosave

    if (res && res.success === false && /server is busy/i.test(res.message || '')) {
      // LockService couldn't get in — this draft is NOT saved yet.
      // Don't mark lastSyncedSnapshot; retry a few times with a short,
      // randomized backoff so simultaneous retries don't re-collide.
      if (attempt < 3) {
        const backoff = 3000 + Math.floor(Math.random() * 4000); // 3-7s
        setTimeout(() => syncDraftToSheets(attempt + 1), backoff);
      }
      // if attempt >= 3, give up quietly for now — Layer 1 local copy is
      // safe, and the regular 90s tick will try again from scratch
      return;
    }

    if (res && res.success) lastSyncedSnapshot = snapshot; // only mark synced on real success
  } catch(e) { /* offline/quota hit — Layer 1 local copy is already safe, will retry in 90s */ }
}


function autoSubmitOnTimeUp() {
  if (window._timeUpHandled) return;
  window._timeUpHandled = true;
  showToast('⏰ Time is up! Submitting your test now...', 'danger', 8000);
  submitTest(true);
}

function switchSection(s) {
  if ((s === 'R' && !revealed.R) || (s === 'W' && !revealed.W)) {
    showToast('🔒 Finish the current section first — click "Continue" when ready.', 'warn');
    return;
  }
  cur=s;
  ['L','R','W'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===s));
  document.getElementById('R-left').classList.toggle('hidden',s!=='R');
  document.getElementById('W-left').classList.toggle('hidden',s!=='W');
  document.getElementById('L-right').classList.toggle('hidden',s!=='L');
  document.getElementById('R-right').classList.toggle('hidden',s!=='R');
  document.getElementById('W-right').classList.toggle('hidden',s!=='W');
  document.getElementById('submit-btn').style.display = s==='W' ? 'block' : 'none';
  document.querySelector('.main').classList.toggle('no-left', s==='L'); // Listening has no left panel at all now — audio controls live inline in the right panel
  buildNav(s);
  renderTabLocks();
  if(s==='R')syncPassage(1);
  if(s==='W')switchWriting(curWriting,true);
}

function switchLSection(n) {
  curLSec=n;
  for(let i=1;i<=4;i++) document.getElementById('lst'+i).classList.toggle('active',i===n);
  for(let i=1;i<=4;i++) document.getElementById('L-qs-'+i).classList.toggle('hidden', i!==n);
  const ranges=['1–10','11–20','21–30','31–40'];
  document.getElementById('L-q-head').innerText='Questions '+ranges[n-1];
  const nextBtn = document.getElementById('L-next-btn');
  if (nextBtn) {
    if (n < 4) { nextBtn.style.opacity = '1'; }
    else { nextBtn.textContent = 'Waiting for audio to finish…'; nextBtn.style.opacity = '0.6'; }
  }
  refreshSectionNextBtn();
  buildLQs(n);
  const sec=config.listening&&config.listening.sections&&config.listening.sections[n-1];
  const img=document.getElementById('audio-img');

  // The label reflects whichever track is actually loaded/playing (queuePos),
  // not whichever section tab the candidate is currently viewing — those two
  // can differ once playback is underway and the candidate has moved on.
  if (continuousQueue.length > 0) {
    const playingSecNum = continuousQueue[queuePos] ? continuousQueue[queuePos].idx + 1 : n;
    document.getElementById('L-section-label').innerText = isSingleContinuousAudio
      ? 'Section Audio (continuous)'
      : `Playing: Section ${playingSecNum} Audio`;
  } else {
    document.getElementById('L-section-label').innerText = `Section ${n} Audio`;
  }

  // Image is independent of whether audio exists for this section
  if (sec && sec.imgURL) { img.src = sec.imgURL; img.style.display = 'block'; }
  else if (sec && sec.imgData) { img.src = sec.imgData; img.style.display = 'block'; }
  else { img.src = ''; img.style.display = 'none'; }

  // Once there's a queue of audio to play, switching tabs to look at other
  // questions must never touch the player — it keeps playing uninterrupted
  // and auto-advances through the queue on its own (see onAudioEnd).
  if (continuousQueue.length > 0) return;

  loadAudioForSection(sec, n);
}

// Waits for the browser to actually buffer enough of the audio before
// telling the candidate it's "Ready to play" — with preload="auto" set on
// #audio-el, this buffering starts the moment the section loads (well
// before the candidate would click Play), so by the time they do click,
// playback should start instantly instead of stalling to buffer first.
// Falls back to enabling the button after a few seconds regardless, so a
// slow connection or a server that doesn't estimate buffering well never
// leaves the candidate stuck unable to click Play at all.
function armAudioReadyState_(el, btn, status, alreadyDone) {
  btn.disabled = true;
  status.innerText = alreadyDone ? 'Recording finished' : 'Loading audio...';

  let settled = false;
  const settle = () => {
    if (settled || audioSessionStarted) return;
    settled = true;
    btn.disabled = alreadyDone;
    status.innerText = alreadyDone ? 'Recording finished' : 'Ready to play';
    el.removeEventListener('canplay', settle);
    el.removeEventListener('error', onError);
    clearTimeout(fallback);
  };
  const onError = () => {
    if (settled) return;
    settled = true;
    status.innerText = 'Audio failed to load — try refreshing the page';
    clearTimeout(fallback);
  };
  const fallback = setTimeout(settle, 6000); // don't make anyone wait forever on a slow link

  el.addEventListener('canplay', settle);
  el.addEventListener('error', onError);
}

function loadAudioForSection(sec, n, autoplay) {
  const btn    = document.getElementById('play-btn');
  const status = document.getElementById('audio-status');

  stopAndResetPlayer();

  const alreadyDone = audioSessionStarted && !autoplay; // mid-queue auto-advances should never re-disable-then-need-a-click

  if (sec && sec.audioURL) {
    const ytId = extractYouTubeId(sec.audioURL);
    if (ytId) {
      currentAudioMode = 'youtube';
      btn.disabled = alreadyDone;
      status.innerText = autoplay ? 'Playing — listen carefully' : (alreadyDone ? 'Recording finished' : 'Ready to play');
      if (ytReady && ytPlayer && ytPlayer.cueVideoById) ytPlayer.cueVideoById(ytId);
      else ytPendingVideoId = ytId;
      if (autoplay && ytReady && ytPlayer && ytPlayer.playVideo) {
        ytPlayer.playVideo();
        progressInterval = setInterval(updateProgress, 400);
      }
    } else {
      // Direct audio URL (mp3 etc.) — still routed through our custom button
      currentAudioMode = 'file';
      const el = document.getElementById('audio-el');
      el.src = resolvePlayableAudioURL(sec.audioURL);
      if (autoplay) {
        btn.disabled = alreadyDone;
        status.innerText = 'Playing — listen carefully';
        el.play();
        progressInterval = setInterval(updateProgress, 400);
      } else {
        armAudioReadyState_(el, btn, status, alreadyDone);
      }
    }
  } else if (sec && sec.audioData) {
    currentAudioMode = 'file';
    const el = document.getElementById('audio-el');
    el.src = sec.audioData;
    if (autoplay) {
      btn.disabled = alreadyDone;
      status.innerText = 'Playing — listen carefully';
      el.play();
      progressInterval = setInterval(updateProgress, 400);
    } else {
      armAudioReadyState_(el, btn, status, alreadyDone);
    }
  } else {
    currentAudioMode = 'none';
    btn.disabled = true;
    status.innerText = 'No audio for this section';
  }
  document.getElementById('audio-prog').style.width = '0%';
}

function stopAndResetPlayer() {
  if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
  const el = document.getElementById('audio-el');
  el.pause(); el.removeAttribute('src'); el.load();
  if (ytReady && ytPlayer && ytPlayer.stopVideo) { try { ytPlayer.stopVideo(); } catch(e){} }
}

// Detect once on load: build an ordered playback queue from every section's
// audio track. Consecutive sections sharing the exact same URL collapse into
// a single queue entry (handles the "same link pasted in all 4 sections"
// case as one continuous track, same as before). Sections with distinct
// links each get their own queue entry and are auto-played back-to-back —
// this is what makes the player "universal": once started, it keeps going
// regardless of which section tab the candidate is looking at.
function detectSingleContinuousAudio() {
  const sections = (config.listening && config.listening.sections) || [];
  const raw = sections
    .map((s, i) => ({ url: s && (s.audioURL || s.audioData), idx: i }))
    .filter(x => x.url);

  continuousQueue = [];
  raw.forEach(item => {
    const last = continuousQueue[continuousQueue.length - 1];
    if (last && last.url === item.url) return; // same clip as the one before — don't reload it again
    continuousQueue.push(item);
  });
  queuePos = 0;

  // Kept for anything elsewhere that still reads this flag.
  isSingleContinuousAudio = continuousQueue.length === 1 && raw.length >= 2;
}

function syncPassage(n){
  curPassage = n;
  for(let i=1;i<=3;i++){
    document.getElementById('pass'+i).classList.toggle('hidden',i!==n);
    const lp=document.getElementById('lp'+i);if(lp)lp.classList.toggle('active',i===n);
    const rp=document.getElementById('rp'+i);if(rp)rp.classList.toggle('active',i===n);
  }
  const ranges=['1–13','14–26','27–40'];
  document.getElementById('r-q-head').innerText='Questions '+ranges[n-1];
  document.querySelectorAll('.r-q-group').forEach((g,i)=>g.classList.toggle('hidden',i!==n-1));
  const nextBtn = document.getElementById('R-next-btn');
  if (nextBtn) refreshSectionNextBtn();
}

function goToNextPassage() {
  if (curPassage < 3) {
    syncPassage(curPassage + 1);
  } else {
    continueToNextSection(); // unlocks Writing and switches to it — same as the header's Continue button
  }
}

function goToNextLSection() {
  if (curLSec < 4) {
    switchLSection(curLSec + 1);
  } else {
    showToast('📻 Keep listening — Reading unlocks automatically once the audio finishes.', 'info');
  }
}

function markQ(sec,n,el){
  const val=el.type==='radio'?el.checked:el.value.trim()!=='';
  answered[sec][n]=val;
  const rawVal=el.type==='radio'?(el.checked?el.value:''):(el.value.trim());
  if(sec==='L')lAnswers[n]=rawVal; else rAnswers[n]=rawVal;
  if(el.type==='text')el.classList.toggle('filled',val);
  if(el.type==='radio'){
    document.querySelectorAll(`[name="${el.name}"]`).forEach(r=>r.closest('.mc-opt').classList.remove('sel'));
    if(el.checked)el.closest('.mc-opt').classList.add('sel');
  }
  buildNav(cur);
  refreshSectionNextBtn();
}

// Lightweight version of the "update the Next button" logic from
// switchLSection/syncPassage — used on every answer change, so it must
// NOT rebuild the question list (that would blow away focus mid-typing).
function refreshSectionNextBtn() {
  if (cur === 'L') {
    const nextBtn = document.getElementById('L-next-btn');
    if (!nextBtn) return;
    const ranges=[[1,10],[11,20],[21,30],[31,40]];
    const [from,to] = ranges[curLSec-1];
    let done = 0, total = 0;
    for (let i=from;i<=to;i++) { total++; if (answered.L && answered.L[i]) done++; }
    const allDone = total > 0 && done === total;
    if (curLSec < 4) {
      nextBtn.textContent = (allDone ? '✓ ' : '') + 'Next Section →' + (allDone ? '' : ` (${done}/${total} answered)`);
      nextBtn.style.background = allDone ? '#1a7a4c' : 'var(--blue,#1a4d8f)';
    }
  } else if (cur === 'R') {
    const nextBtn = document.getElementById('R-next-btn');
    if (!nextBtn) return;
    const ranges=[[1,13],[14,26],[27,40]];
    const [from,to] = ranges[curPassage-1];
    let done = 0, total = 0;
    for (let i=from;i<=to;i++) { total++; if (answered.R && answered.R[i]) done++; }
    const allDone = total > 0 && done === total;
    nextBtn.textContent = curPassage < 3
      ? (allDone ? '✓ ' : '') + 'Next Passage →' + (allDone ? '' : ` (${done}/${total} answered)`)
      : 'Done — Continue to Writing →';
    if (curPassage < 3) nextBtn.style.background = allDone ? '#1a7a4c' : 'var(--blue,#1a4d8f)';
  }
}

function buildNav(s){
  const wrap=document.getElementById('nav-squares');
  wrap.innerHTML='';
  if(s==='W'){ updateNavSummary_(); return; }
  const ans=answered[s]||{};
  for(let i=1;i<=40;i++){
    const d=document.createElement('div');
    d.className='nav-sq'+(ans[i]?' done':'');
    d.innerText=i;
    d.title='Jump to question '+i;
    d.onclick=()=>jumpToQuestion_(s,i);
    wrap.appendChild(d);
  }
  updateNavSummary_();
}

// Tags each rendered question block with its number (read off the visible
// "q-num" label) so a nav-square click can scroll straight to it — the
// render functions build several different block shapes (mc/cl/matching/
// short-answer), so tagging is done once, after the fact, instead of
// touching every template.
function tagQuestionBlocks_(container){
  container.querySelectorAll('.q-block').forEach(el=>{
    const numEl=el.querySelector('.q-num');
    const m=numEl && numEl.textContent.match(/\d+/);
    if(m) el.dataset.qn=m[0];
  });
}

function jumpToQuestion_(sec,n){
  if (sec==='L') {
    switchSection('L');
    switchLSection(lSubsectionOf_(n));
  } else {
    if (!revealed.R) { showToast('🔒 Finish Listening first.', 'warn'); return; }
    switchSection('R');
    syncPassage(n<=13?1:(n<=26?2:3));
  }
  setTimeout(()=>scrollToQuestionBlock_(sec,n), 60); // let the section swap render first
}

function scrollToQuestionBlock_(sec,n){
  const container=document.getElementById(sec==='L'?'L-right':'R-right');
  if(!container) return;
  tagQuestionBlocks_(container);
  let target=container.querySelector(`.q-block[data-qn="${n}"]`);
  if(!target){
    // grouped question types (matching/headings) may only tag their first
    // number — fall back to the nearest block at or before N
    let bestNum=-1;
    container.querySelectorAll('.q-block[data-qn]').forEach(el=>{
      const num=parseInt(el.dataset.qn,10);
      if(num<=n && num>bestNum){ bestNum=num; target=el; }
    });
  }
  if(target){
    target.scrollIntoView({behavior:'smooth', block:'center'});
    target.style.outline='2px solid var(--gold)';
    setTimeout(()=>{ if(target) target.style.outline=''; }, 1500);
  }
}

// ══════════════════════════════════════
// COLLAPSIBLE PROGRESS BAR — the always-visible number grid can feel like
// clutter, especially while reading a passage or writing an essay, so it can
// be minimized down to just a summary count. Choice persists across reloads.
// ══════════════════════════════════════
function updateNavSummary_(){
  const el=document.getElementById('nav-summary');
  if(!el) return;
  if(cur==='W'){
    const wc=(writingVals[curWriting]||document.getElementById('w-textarea')?.value||'').trim();
    el.innerText = wc ? 'Writing in progress' : 'Not started';
    return;
  }
  const ans=answered[cur]||{};
  const count=Object.keys(ans).filter(k=>ans[k]).length;
  el.innerText = `${count}/40 answered`;
}

function toggleNavFooter(forceCollapsed){
  const footer=document.getElementById('nav-footer');
  const collapsed = typeof forceCollapsed==='boolean' ? forceCollapsed : !footer.classList.contains('collapsed');
  footer.classList.toggle('collapsed', collapsed);
  document.getElementById('nav-toggle-btn').innerText = collapsed ? '▸ Show' : '▾ Minimize';
  document.getElementById('nav-summary').style.display = collapsed ? 'inline' : 'none';
  try{ localStorage.setItem('ielts_nav_collapsed', collapsed?'1':'0'); }catch(e){}
}

function playAudio(){
  if (audioSessionStarted) return; // one continuous listening session — no replays, matches the real exam

  document.getElementById('play-btn').disabled=true;
  document.getElementById('audio-status').innerText='Playing — listen carefully';
  audioSessionStarted = true;
  audioPlayed=[true,true,true,true]; // the whole session counts as "played" the moment it starts

  if (currentAudioMode === 'youtube' && ytReady && ytPlayer && ytPlayer.playVideo) {
    ytPlayer.playVideo();
    if (audioSeekOnPlay > 0) { ytPlayer.seekTo(audioSeekOnPlay, true); audioSeekOnPlay = 0; }
    progressInterval = setInterval(updateProgress, 400);
  } else if (currentAudioMode === 'file') {
    const el = document.getElementById('audio-el');
    if (audioSeekOnPlay > 0) {
      const seekTo = audioSeekOnPlay;
      audioSeekOnPlay = 0;
      const doSeek = () => { el.currentTime = seekTo; el.removeEventListener('loadedmetadata', doSeek); };
      if (el.readyState >= 1) el.currentTime = seekTo; else el.addEventListener('loadedmetadata', doSeek);
    }
    el.play();
    progressInterval = setInterval(updateProgress, 400);
  }
}

function onAudioEnd(){
  if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }

  const nextPos = queuePos + 1;
  if (nextPos < continuousQueue.length) {
    // More sections' audio still queued up — auto-advance without needing
    // another button press, and regardless of which tab is open right now.
    queuePos = nextPos;
    const sections = (config.listening && config.listening.sections) || [];
    const nextItem = continuousQueue[queuePos];
    const nextSec = sections[nextItem.idx];
    loadAudioForSection(nextSec, nextItem.idx + 1, true);
    // Refresh the label if the candidate happens to be looking at the player.
    if (document.getElementById('L-section-label')) {
      document.getElementById('L-section-label').innerText = `Playing: Section ${nextItem.idx + 1} Audio`;
    }
    return;
  }

  // All sections' audio have played through — this is the real end of
  // Listening. Give a forced 60-second review window, then move on
  // automatically. No manual "Continue" button anymore; this is the only
  // trigger into Reading.
  document.getElementById('audio-status').innerText='Recording finished';
  document.getElementById('audio-prog').style.width='100%';
  startListeningReviewCountdown_();
}

// Fired once, right when the very last queued audio track ends ("Recording
// finished"). Gives the candidate REVIEW_SECONDS to look over/finish their
// Listening answers — inputs stay fully editable — then force-advances into
// Reading, at which point the real Reading+Writing countdown starts.
const REVIEW_SECONDS = 60;
let _reviewCountdownStarted = false; // guards against double-firing (e.g. a stray duplicate 'ended' event)
function startListeningReviewCountdown_() {
  if (_reviewCountdownStarted || revealed.R) return;
  _reviewCountdownStarted = true;

  let secsLeft = REVIEW_SECONDS;
  const statusEl = document.getElementById('audio-status');

  showToast('🔊 Recording finished — you have 60 seconds to review your Listening answers before Reading begins.', 'info', 8000);

  const tick = () => {
    if (statusEl) statusEl.innerText = `Review time — ${secsLeft}s left`;
    if (secsLeft === 10) showToast('⏳ 10 seconds left to review your Listening answers.', 'warn', 6000);
    if (secsLeft <= 0) {
      clearInterval(reviewInterval);
      proceedToReadingNow_();
      return;
    }
    secsLeft--;
  };
  tick();
  const reviewInterval = setInterval(tick, 1000);
}

// Forces the transition out of Listening into Reading — the only way this
// now happens, replacing the old manually-clicked "Continue" button. Starts
// the real Reading+Writing countdown for the first time here.
function proceedToReadingNow_() {
  if (revealed.R) return; // already moved on (e.g. safety-net + real audio both firing)
  revealed.R = true;
  saveRevealState();
  initTimer();
  showToast('📖 Time’s up — moving to Reading.', 'info');
  switchSection('R');
}

function updateProgress(){
  let pct = 0;
  if (currentAudioMode === 'youtube' && ytReady && ytPlayer && ytPlayer.getDuration) {
    const dur = ytPlayer.getDuration();
    if (dur > 0) pct = (ytPlayer.getCurrentTime() / dur) * 100;
    audioPlaybackState = { queuePos, time: ytPlayer.getCurrentTime() || 0, started: audioSessionStarted };
  } else if (currentAudioMode === 'file') {
    const el = document.getElementById('audio-el');
    if (el.duration) pct = (el.currentTime / el.duration) * 100;
    audioPlaybackState = { queuePos, time: el.currentTime || 0, started: audioSessionStarted };
  }
  document.getElementById('audio-prog').style.width = Math.min(100, pct) + '%';
}

function switchWriting(n,skipSave){
  if(!skipSave)writingVals[curWriting]=document.getElementById('w-textarea').value;
  curWriting=n;
  document.getElementById('wt1-tab').classList.toggle('active',n===1);
  document.getElementById('wt2-tab').classList.toggle('active',n===2);
  document.getElementById('w-prompt-1').classList.toggle('hidden',n!==1);
  document.getElementById('w-prompt-2').classList.toggle('hidden',n!==2);
  document.getElementById('w-textarea').value=writingVals[n];
  const minWords=(config.writing&&config.writing.tasks&&config.writing.tasks[n]&&config.writing.tasks[n].minWords)||(n===1?150:250);
  document.getElementById('wc-min').innerText=minWords;
  updateWC();
}
function updateWC(){
  const txt=document.getElementById('w-textarea').value.trim();
  const wc=txt?txt.split(/\s+/).length:0;
  document.getElementById('wc').innerText=wc;
  const min=parseInt(document.getElementById('wc-min').innerText)||150;
  const bar=document.getElementById('wc-bar');
  bar.style.width=Math.min((wc/min)*100,100)+'%';
  bar.style.background=wc>=min?'var(--green)':'var(--blue2)';
}

// Build Q from config
// ─── Read questions from qBlocks (new format) or questions (legacy) ───
function getQBlocks(sec, secIdx) {
  const store = sec==='L'
    ? (config.listening  && config.listening.qBlocks)
    : (config.reading    && config.reading.qBlocks);
  if (!store) return null;
  // Try direct key (e.g. "1", "11", "21", "31" for L sections)
  if (store[secIdx]) return store[secIdx];
  // Also try section number (1,2,3,4) for L or (1,2,3) for R
  const secNumMap = sec==='L'
    ? { 1:1, 11:2, 21:3, 31:4 }
    : { 1:1, 14:2, 27:3 };
  const secNum = secNumMap[secIdx];
  if (secNum && store[secNum]) return store[secNum];
  // Try string versions
  if (store[String(secIdx)]) return store[String(secIdx)];
  if (secNum && store[String(secNum)]) return store[String(secNum)];
  return null;
}

function getQs(sec) {
  if(sec==='L') return (config.listening && config.listening.questions)||{};
  return (config.reading && config.reading.questions)||{};
}

// ─── Render a qBlocks array into HTML ───
function renderQBlocksHTML(sec, blocks, sectionLabel) {
  if (!blocks || !blocks.length) return `<div class="q-section-label">${sectionLabel}</div><div style="color:var(--ink3);font-size:0.85rem;padding:12px 0">No questions set for this section.</div>`;
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let html = `<div class="q-section-label">${sectionLabel}</div>`;

  blocks.forEach((b, bi) => {

    // INSTRUCTIONS block
    if (b.type === 'instructions') {
      html += `<div style="background:var(--paper2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:14px;font-size:0.88rem;color:var(--ink2);line-height:1.6">${escH(b.text||b.instr||'')}</div>`;
      return;
    }

    // FORM COMPLETION block
    if (b.type === 'fc') {
      if (b.instr) html += `<div style="background:var(--paper2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:12px;font-size:0.88rem;color:var(--ink2)">${escH(b.instr)}</div>`;

      // Show image
      if (b.fcImgURL) html += `<div style="margin-bottom:12px"><img src="${escH(b.fcImgURL)}" style="max-width:100%;border-radius:8px;border:1px solid var(--border)"></div>`;
      if (b.imgData)  html += `<div style="margin-bottom:12px"><img src="${b.imgData}" style="max-width:100%;border-radius:8px;border:1px solid var(--border)"></div>`;

      // fcLines mode — Visual Line Builder output
      if (b.fcLines && b.fcLines.length) {
        html += `<div class="fc-render" style="font-family:'Source Serif 4',serif;font-size:0.92rem;line-height:2.2">`;
        b.fcLines.forEach(line => {
          const segsHTML = line.segments.map(s => {
            if (s.stype === 'blank') {
              return `<input type="text" id="fc-inp-${sec}-${s.num}" value="" class="fc-inline-input" oninput="markFCQ('${sec}',${s.num},this)" style="display:inline-block;border:none;border-bottom:2px solid var(--blue);background:var(--input-focus,#fff9c4);width:100px;padding:1px 4px;font-family:inherit;font-size:inherit;text-align:center;outline:none;color:var(--ink);border-radius:0;vertical-align:middle">`;
            }
            return `<span>${escH(s.text||'')}</span>`;
          }).join(' ');

          if (line.ltype === 'heading')         html += `<h3 style="font-family:'Source Serif 4',serif;font-size:1rem;font-weight:600;color:var(--blue);margin:14px 0 6px">${segsHTML}</h3>`;
          else if (line.ltype === 'subheading') html += `<h4 style="font-family:'Source Serif 4',serif;font-size:0.92rem;font-weight:600;color:var(--blue2);margin:10px 0 4px">${segsHTML}</h4>`;
          else if (line.ltype === 'bullet')     html += `<div style="padding-left:18px;margin:1px 0">• ${segsHTML}</div>`;
          else                                   html += `<div style="margin:1px 0">${segsHTML}</div>`;
        });
        html += `</div>`;
        return;
      }

      // fcHtml template mode (legacy)
      if (b.fcHtml) {
        const rendered = b.fcHtml.replace(/\{\{(\d+)\}\}/g, (_, n) =>
          `<input type="text" value="" class="fc-inline-input" id="fc-inp-${sec}-${n}" oninput="markFCQ('${sec}',${n},this)" style="display:inline-block;border:none;border-bottom:2px solid var(--blue);background:var(--input-focus,#fff9c4);width:100px;padding:1px 4px;font-family:inherit;font-size:inherit;text-align:center;outline:none;color:var(--ink);border-radius:0;vertical-align:middle">`
        );
        html += `<div class="fc-render" style="font-family:'Source Serif 4',serif;font-size:0.92rem;line-height:2.2">${rendered}</div>`;
        return;
      }

      // Blanks array fallback
      if (b.blanks && b.blanks.length) {
        html += `<div class="fc-inputs">`;
        b.blanks.forEach(blank => {
          html += `<div class="fc-input-row"><span class="q-num">${blank.num}</span><input type="text" placeholder="..." oninput="markFCQ('${sec}',${blank.num},this)"></div>`;
        });
        html += `</div>`;
      } else {
        const from=b.fcFrom||1, to=b.fcTo||10;
        html += `<div class="fc-inputs">`;
        for (let i=from;i<=to;i++) html+=`<div class="fc-input-row"><span class="q-num">${i}</span><input type="text" placeholder="..." oninput="markFCQ('${sec}',${i},this)"></div>`;
        html += `</div>`;
      }
      return;
    }

    // MATCHING block
    if (b.type === 'matching') {
      const nums  = b.numbers || (b.qNums) || [];
      const opts  = b.options || [];
      if (b.instr||b.text) html += `<div style="background:var(--paper2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:12px;font-size:0.88rem;color:var(--ink2)">${escH(b.instr||b.text)}</div>`;
      // Options box
      if (opts.length) {
        html += `<div class="matching-options-box">`;
        opts.forEach(o => {
          const letter = o.letter||o;
          const text   = o.text||'';
          html += `<div><strong>${escH(letter)}</strong> ${escH(text)}</div>`;
        });
        html += `</div>`;
      }
      // Question rows
      nums.forEach(n => {
        const label = b.labels && b.labels[n] ? b.labels[n] : `Question ${n}`;
        html += `<div class="q-block"><div class="q-text"><span class="q-num">${n}</span>${escH(label)}</div>
          <input class="q-input" type="text" maxlength="2" placeholder="e.g. A" style="text-transform:uppercase;width:80px" oninput="markQ('${sec}',${n},this)"></div>`;
      });
      return;
    }

    // CHOOSE LETTERS (grouped) — e.g. Q14 and Q15
    if (b.type === 'cl' || b.type === 'choose-letters') {
      const nums    = b.numbers || (b.qNums) || (b.qNum?[b.qNum]:[]);
      const opts    = b.options || [];
      const choose  = b.choose  || b.clPick || 2;
      const numOpts = b.clCount || opts.length || 5;
      const qLabel  = nums.length > 1
        ? `Questions ${nums.join(' and ')}`
        : `Question ${nums[0]||''}`;
      if (b.instr||b.text) html += `<div style="background:var(--paper2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:12px;font-size:0.88rem;color:var(--ink2)">${escH(b.instr||b.text)}</div>`;
      const groupName = `cl_${sec}_${bi}`;
      html += `<div class="q-block">
        <div class="q-text" style="margin-bottom:8px"><span style="font-size:0.8rem;font-weight:700;color:var(--blue)">${qLabel}</span></div>
        <div style="font-size:0.8rem;color:var(--ink3);margin-bottom:8px">Choose <b>${choose}</b> letter(s). <span style="color:var(--red);font-size:0.75rem">✗ if you tick more than ${choose}</span></div>
        <div class="mc-opts">`;
      for (let i=0; i<numOpts; i++) {
        const letter = letters[i];
        const optText = opts[i] || '';
        html += `<label class="mc-opt"><input type="checkbox" name="${groupName}" value="${letter}" onchange="markGroupedCL('${sec}',${JSON.stringify(nums)},this,${choose},'${groupName}')"> <span><b>${letter}</b>${optText?' — '+escH(optText):''}</span></label>`;
      }
      html += `</div></div>`;
      return;
    }

    // CHOOSE TWO (ct2) — qFrom/qTo range, shared options
    if (b.type === 'ct2') {
      const qFrom   = b.qFrom || 21;
      const qTo     = b.qTo   || 22;
      const pick    = b.pick  || 2;
      const opts    = b.options || [];
      const nums    = [];
      for (let i=qFrom; i<=qTo; i++) nums.push(i);
      const groupName = `ct2_${sec}_${bi}`;
      const qLabel  = nums.length > 1 ? `Questions ${qFrom} and ${qTo}` : `Question ${qFrom}`;

      // Show instr only if different from previous block
      if (b.instr && (bi===0 || blocks[bi-1]?.instr !== b.instr)) {
        html += `<div style="background:var(--paper2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:12px;font-size:0.88rem;color:var(--ink2);white-space:pre-line">${escH(b.instr)}</div>`;
      }
      html += `<div class="q-block">
        <div class="q-text" style="margin-bottom:6px;font-weight:600;color:var(--blue)">${qLabel}</div>
        <div style="font-size:0.85rem;color:var(--ink2);margin-bottom:8px;font-style:italic">${escH(b.qText||'')}</div>
        <div style="font-size:0.8rem;color:var(--ink3);margin-bottom:8px">Choose <b>${pick}</b> letters. <span style="color:var(--red);font-size:0.75rem">(Max ${pick})</span></div>
        <div class="mc-opts${(b.optionImages||[]).some(Boolean) ? ' mc-opts-grid' : ''}">`;
      const ct2Imgs = b.optionImages || [];
      opts.forEach((opt, i) => {
        const imgTag = ct2Imgs[i] ? `<img src="${escH(ct2Imgs[i])}" class="mc-opt-thumb" onerror="this.style.display='none'">` : '';
        html += `<label class="mc-opt" style="align-items:flex-start"><input type="checkbox" name="${groupName}" value="${letters[i]}" onchange="markGroupedCL('${sec}',${JSON.stringify(nums)},this,${pick},'${groupName}')" style="margin-top:3px"> <span><b>${letters[i]}</b> — ${escH(opt)}${imgTag}</span></label>`;
      });
      html += `</div></div>`;
      return;
    }

    // MATCH type — matchChoices + matchItems
    if (b.type === 'match') {
      const choices  = b.matchChoices || [];
      const items    = b.matchItems   || [];
      const prompt   = b.matchPrompt  || b.instr || '';

      if (b.instr && (bi===0 || blocks[bi-1]?.instr !== b.instr)) {
        html += `<div style="background:var(--paper2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:12px;font-size:0.88rem;color:var(--ink2);white-space:pre-line">${escH(b.instr)}</div>`;
      }

      // Map/Plan/Diagram image (Map Labeling variant of Matching) — shown
      // above the Choice Box so candidates can see the picture alongside
      // the A-H legend before answering.
      if (b.mapImgURL) {
        html += `<img src="${escH(b.mapImgURL)}" style="width:100%;max-height:360px;object-fit:contain;border-radius:8px;border:1px solid var(--border);margin-bottom:14px;background:var(--paper2)" onerror="this.style.display='none'">`;
      }

      // Options box — only shown if at least one choice actually has text.
      // When the map/plan image already shows the labels (A, B, C... drawn
      // directly on it), the admin leaves matchChoices blank and this box
      // is skipped so it doesn't repeat what's already on the picture.
      if (prompt) html += `<div style="font-size:0.88rem;color:var(--ink2);margin-bottom:10px;line-height:1.6">${prompt.replace(/\n/g,'<br>')}</div>`;
      const filledChoices = choices.filter(c => (c||'').trim());
      if (filledChoices.length) {
        html += `<div class="matching-options-box" style="margin-bottom:14px">`;
        choices.forEach((c, i) => {
          if ((c||'').trim()) html += `<div><strong>${letters[i]}</strong> &nbsp; ${escH(c)}</div>`;
        });
        html += `</div>`;
      }
      // Question rows
      items.forEach(item => {
        const n = parseInt(item.num)||0;
        const maxLtr = filledChoices.length ? (letters[choices.length-1]||'H') : 'H'; // no filled choices = labels are on the image itself, so just hint the general A-H range
        html += `<div class="q-block">
          <div class="q-text"><span class="q-num">${item.num}</span>${escH(item.label||'')}</div>
          <input class="q-input" type="text" maxlength="2" placeholder="A–${maxLtr}" style="text-transform:uppercase;width:80px" oninput="markQ('${sec}',${n},this)">
        </div>`;
      });
      return;
    }

    // SINGLE QUESTION (short, mc, tfng, yntg)
    const n    = b.qNum || (b.numbers&&b.numbers[0]) || 0;
    const text = b.qText || b.text || '';
    const type = b.type;

    if (!n) return;

    // Show instr only if different from previous block's instr
    if (b.instr && (bi===0 || blocks[bi-1]?.instr !== b.instr)) {
      html += `<div style="background:var(--paper2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:12px;font-size:0.88rem;color:var(--ink2);white-space:pre-line">${escH(b.instr)}</div>`;
    }

    let inner = '';
    if (type==='mc') {
      const opts    = b.options||[];
      const optImgs = b.optionImages||[];
      const mcCount = b.mcCount||opts.length||4;
      inner = `<div class="mc-opts${optImgs.some(Boolean) ? ' mc-opts-grid' : ''}">`;
      for (let i=0;i<mcCount;i++) {
        const imgTag = optImgs[i] ? `<img src="${escH(optImgs[i])}" class="mc-opt-thumb" onerror="this.style.display='none'">` : '';
        inner += `<label class="mc-opt" style="align-items:flex-start"><input type="radio" name="q${sec}${n}" value="${letters[i]}" onchange="markQ('${sec}',${n},this)" style="margin-top:3px"> <span><b>${letters[i]}</b>${opts[i]?' — '+escH(opts[i]):''}${imgTag}</span></label>`;
      }
      inner += '</div>';
    } else if (type==='tfng') {
      inner = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">'+
        ['TRUE','FALSE','NOT GIVEN'].map(v=>`<label style="display:flex;align-items:center;gap:4px;font-size:0.82rem;cursor:pointer;padding:5px 10px;border:1px solid var(--paper3);border-radius:5px"><input type="radio" name="q${sec}${n}" value="${v}" onchange="markQ('${sec}',${n},this)"> ${v}</label>`).join('') + '</div>';
    } else if (type==='yntg') {
      inner = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">'+
        ['YES','NO','NOT GIVEN'].map(v=>`<label style="display:flex;align-items:center;gap:4px;font-size:0.82rem;cursor:pointer;padding:5px 10px;border:1px solid var(--paper3);border-radius:5px"><input type="radio" name="q${sec}${n}" value="${v}" onchange="markQ('${sec}',${n},this)"> ${v}</label>`).join('') + '</div>';
    } else {
      // short answer
      inner = `<input class="q-input" type="text" placeholder="Write answer..." oninput="markQ('${sec}',${n},this)">`;
    }
    html += `<div class="q-block"><div class="q-text"><span class="q-num">${n}</span>${escH(text)}</div>${inner}</div>`;
  });

  return html;
}

function markGroupedCL(sec, nums, el, maxPick, groupName) {
  const checked = [...document.querySelectorAll(`[name="${groupName}"]:checked`)];
  if (checked.length > maxPick) { el.checked=false; return; }
  const val = checked.map(c=>c.value).join(', ');
  // Assign to each question number in the group
  nums.forEach((n,i) => {
    answered[sec][n] = checked.length > i;
    const v = checked[i] ? checked[i].value : '';
    if (sec==='L') lAnswers[n]=v; else rAnswers[n]=v;
  });
  buildNav(cur);
}

function buildQBlock(sec,n){
  const qs=getQs(sec);
  const q=qs[n]||{text:'Question '+n,type:'short',options:['','',''],answer:''};
  let inner='';
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  if(q.type==='mc'){
    const opts=q.options||['','',''];
    const optImgs=q.optionImages||[];
    inner=`<div class="mc-opts${optImgs.some(Boolean) ? ' mc-opts-grid' : ''}">`+['A','B','C'].map((l,i)=>
      `<label class="mc-opt" style="align-items:flex-start"><input type="radio" name="q${sec}${n}" value="${l}" onchange="markQ('${sec}',${n},this)" style="margin-top:3px"> <span>${l} &nbsp; ${escH(opts[i]||'Option '+l)}${optImgs[i]?`<img src="${escH(optImgs[i])}" class="mc-opt-thumb" onerror="this.style.display='none'">`:''}</span></label>`
    ).join('')+'</div>';

  } else if(q.type==='cl'){
    const numOpts=q.clCount||5;
    const numPick=q.clPick||2;
    const opts=q.options||[];
    inner=`<div style="font-size:0.8rem;color:var(--ink3);margin-bottom:6px">Choose <b>${numPick}</b> letter(s).</div>
    <div class="mc-opts">`;
    for(let i=0;i<numOpts;i++){
      const letter=letters[i];
      inner+=`<label class="mc-opt"><input type="checkbox" name="qcl${sec}${n}" value="${letter}" onchange="markCLQ('${sec}',${n},this,${numPick})"> <span>${letter} &nbsp; ${escH(opts[i]||'Option '+letter)}</span></label>`;
    }
    inner+=`</div>`;

  } else if(q.type==='tfng'){
    inner='<div class="mc-opts"><div style="display:flex;gap:8px;margin-top:6px">'+
      ['TRUE','FALSE','NOT GIVEN'].map(v=>
        `<label style="display:flex;align-items:center;gap:4px;font-size:0.82rem;cursor:pointer"><input type="radio" name="q${sec}${n}" value="${v}" onchange="markQ('${sec}',${n},this)"> ${v}</label>`
      ).join('')+'</div></div>';

  } else {
    inner=`<input class="q-input" type="text" placeholder="Write answer..." oninput="markQ('${sec}',${n},this)">`;
  }
  return `<div class="q-block"><div class="q-text"><span class="q-num">${n}</span>${escH(q.text||'Question '+n)}</div>${inner}</div>`;
}

function markCLQ(sec,n,el,maxPick){
  const checked=[...document.querySelectorAll(`[name="qcl${sec}${n}"]:checked`)];
  // Enforce max pick
  if(checked.length>maxPick){ el.checked=false; return; }
  const val=checked.map(c=>c.value).join(', ');
  answered[sec][n]=checked.length>0;
  if(sec==='L')lAnswers[n]=val; else rAnswers[n]=val;
  buildNav(cur);
}

let _lSectionsBuilt = {};

function buildLQs(n){
  // If already built once, don't rebuild — rebuilding destroys input values.
  // Just leave the cached DOM in place; switchLSection() handles show/hide.
  if (_lSectionsBuilt[n]) return;
  _lSectionsBuilt[n] = true;

  const c=document.getElementById('L-qs-'+n);
  const fromMap=[1,11,21,31];
  const from=fromMap[n-1];
  const labels=['Section 1 — Questions 1–10','Section 2 — Questions 11–20','Section 3 — Questions 21–30','Section 4 — Questions 31–40'];
  const secCfg=config.listening&&config.listening.sections&&config.listening.sections[n-1];

  // Try qBlocks first (new format)
  const blocks = getQBlocks('L', from);
  if (blocks) {
    c.innerHTML = renderQBlocksHTML('L', blocks, labels[n-1]);
    restoreSavedAnswers('L');
    return;
  }

  // Fallback: old format with FC image
  let html=`<div class="q-section-label">${labels[n-1]}</div>`;
  if(secCfg&&secCfg.formCompletion&&secCfg.fcImgData){
    const fcFrom=secCfg.fcFrom||from, fcTo=secCfg.fcTo||from+9;
    html+=`<div class="fc-image-wrap"><img src="${secCfg.fcImgData}" alt="Form worksheet"></div>`;
    html+=`<div style="font-size:0.82rem;color:var(--ink3);margin-bottom:10px">Fill in blanks <b>${fcFrom}–${fcTo}</b>.</div>`;
    html+=`<div class="fc-inputs">`;
    for(let i=fcFrom;i<=fcTo;i++) html+=`<div class="fc-input-row"><span class="q-num">${i}</span><input type="text" placeholder="..." oninput="markFCQ('L',${i},this)"></div>`;
    html+=`</div>`;
  } else {
    const to=from+9;
    for(let i=from;i<=to;i++) html+=buildQBlock('L',i);
  }
  c.innerHTML=html;
  restoreSavedAnswers('L');
}

// After (re)rendering question inputs, fill them back in from the in-memory
// answers object. Needed because rebuilding HTML wipes typed-in values —
// this restores them so switching tabs/sections never loses an answer.
function restoreSavedAnswers(sec) {
  const answers = sec==='L' ? lAnswers : rAnswers;
  Object.keys(answers).forEach(numStr => {
    const n = parseInt(numStr);
    const val = answers[numStr];
    if (val === undefined || val === '') return;

    // Text-style inputs (short answer, FC inline, matching, choose-letters comma list)
    const textInput = document.getElementById(`fc-inp-${sec}-${n}`) ||
                       document.querySelector(`.q-block input[type="text"][oninput*="markQ('${sec}',${n}"]`) ||
                       document.querySelector(`input[type="text"][oninput*="markFCQ('${sec}',${n}"]`);
    if (textInput && textInput.value === '') {
      textInput.value = val;
      textInput.classList.add('filled');
      if (textInput.style) { textInput.style.background = 'var(--input-filled-fc-bg)'; }
    }

    // Radio-style inputs (MC, TFNG, YNTG)
    const radio = document.querySelector(`input[type="radio"][name="q${sec}${n}"][value="${CSS.escape(String(val))}"]`);
    if (radio && !radio.checked) {
      radio.checked = true;
      const opt = radio.closest('.mc-opt');
      if (opt) opt.classList.add('sel');
    }

    // Checkbox-style inputs (grouped choose-letters) — val is a comma-separated list
    if (typeof val === 'string' && val.includes(',')) {
      const letters = val.split(',').map(s=>s.trim());
      letters.forEach(letter => {
        const cb = document.querySelector(`input[type="checkbox"][name^="cl_${sec}_"][value="${CSS.escape(letter)}"]:not(:checked)`);
        if (cb) cb.checked = true;
      });
    }
  });
}

function markFCQ(sec,n,el){
  const val=el.value.trim();
  answered[sec][n]=val!=='';
  if(sec==='L')lAnswers[n]=val; else rAnswers[n]=val;
  // Highlight filled inline inputs
  el.style.background = val ? 'var(--input-filled-fc-bg)' : 'var(--input-focus)';
  el.style.borderBottomColor = val ? 'var(--green)' : 'var(--blue)';
  buildNav(cur);
}

function buildRQs(){
  const c=document.getElementById('R-qs');
  const groups=[{p:1,from:1,to:13},{p:2,from:14,to:26},{p:3,from:27,to:40}];
  const labels=['Passage 1 — Questions 1–13','Passage 2 — Questions 14–26','Passage 3 — Questions 27–40'];
  let html='';
  groups.forEach((g,gi)=>{
    html+=`<div class="r-q-group${gi>0?' hidden':''}">`;
    // Try qBlocks first
    const blocks=getQBlocks('R', g.from);
    if(blocks){
      html+=renderQBlocksHTML('R',blocks,labels[gi]);
    } else {
      // Fallback legacy
      const pfc=config.reading&&config.reading.passages_fc&&config.reading.passages_fc[g.p];
      html+=`<div class="q-section-label">${labels[gi]}</div>`;
      if(pfc&&pfc.formCompletion&&pfc.fcImgData){
        const fcFrom=pfc.fcFrom||g.from, fcTo=pfc.fcTo||g.to;
        html+=`<div class="fc-image-wrap"><img src="${pfc.fcImgData}" alt="Form"></div>`;
        html+=`<div class="fc-inputs">`;
        for(let i=fcFrom;i<=fcTo;i++) html+=`<div class="fc-input-row"><span class="q-num">${i}</span><input type="text" placeholder="..." oninput="markFCQ('R',${i},this)"></div>`;
        html+=`</div>`;
      } else {
        for(let i=g.from;i<=g.to;i++) html+=buildQBlock('R',i);
      }
    }
    html+='</div>';
  });
  c.innerHTML=html;
}

function loadPassages(){
  [1,2,3].forEach(i=>{
    const el=document.getElementById('pass'+i);
    const text=config.reading&&config.reading.passages&&config.reading.passages[i];
    el.innerHTML=text?`<h2>Passage ${i}</h2><p>${escH(text).replace(/\n\n/g,'</p><p>')}</p>`:`<p style="color:var(--ink3)">No passage loaded for Passage ${i}.</p>`;

}

function loadWritingPrompts(){
  [1,2].forEach(i=>{
    const t=config.writing&&config.writing.tasks&&config.writing.tasks[i];
    document.getElementById('prompt-text-'+i).textContent=(t&&t.prompt)||'No prompt loaded.';
    const img=document.getElementById('W-img-'+i);
    if(!img) return; // guard: don't let a missing image element abort init (e.g. audio loading) downstream
    if(t&&t.imgURL){ img.src=t.imgURL; img.style.display='block'; }
    else if(t&&t.imgData){ img.src=t.imgData; img.style.display='block'; }
    else img.style.display='none';
  });
}

function scoreToBand(score){
  if(score>=39)return 9.0; if(score>=37)return 8.5; if(score>=35)return 8.0;
  if(score>=33)return 7.5; if(score>=30)return 7.0; if(score>=27)return 6.5;
  if(score>=23)return 6.0; if(score>=20)return 5.5; if(score>=16)return 5.0;
  if(score>=13)return 4.5; if(score>=10)return 4.0; return 3.5;
}

// NOTE: unused/deprecated. Do NOT call this from the candidate-facing UI —
// config.answerKey is intentionally blank in the public config file now.
// Real grading happens server-side in Code.gs's saveScore(), using the
// protected AnswerKeys sheet, so answers are never exposed to the browser.
function autoCheckScore(){
  const answerKey = config.answerKey || {L:{},R:{}};
  let lScore=0, rScore=0;
  for(let i=1;i<=40;i++){
    const key=(answerKey.L[i]||'').toString().trim().toLowerCase();
    const given=(lAnswers[i]||'').toString().trim().toLowerCase();
    if(key&&given===key)lScore++;
  }
  for(let i=1;i<=40;i++){
    const key=(answerKey.R[i]||'').toString().trim().toLowerCase();
    const given=(rAnswers[i]||'').toString().trim().toLowerCase();
    if(key&&given===key)rScore++;
  }
  return {lScore,rScore,lBand:scoreToBand(lScore),rBand:scoreToBand(rScore)};
}

function getUnanswered_(sec){
  const ans = answered[sec] || {};
  const list = [];
  for (let i=1; i<=40; i++) if (!ans[i]) list.push(i);
  return list;
}
function lSubsectionOf_(n){
  if (n<=10) return 1; if (n<=20) return 2; if (n<=30) return 3; return 4;
}
function jumpToL_(n){
  switchSection('L');
  switchLSection(lSubsectionOf_(n));
}
function jumpToR_(){
  switchSection('R');
}

      </div>

function closeReviewModal(){
