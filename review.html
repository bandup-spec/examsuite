<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Answers — BandUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#8888aa;
    --paper:#faf9f7;--paper2:#f2f0ec;--paper3:#e8e5df;
    --blue:#002f5f;--blue2:#1a5fa8;--gold:#c8a84b;
    --green:#2e7d4f;--red:#c0392b;--border:rgba(0,0,0,0.1);
    --okbg:rgba(46,125,79,0.09);--badbg:rgba(192,57,43,0.08);
  }
  body.dark-mode{
    --ink:#e8e8f0;--ink2:#b8b8d0;--ink3:#8888aa;
    --paper:#1c1d2b;--paper2:#23243a;--paper3:#33344a;
    --blue:#1a5fa8;--blue2:#3a7fd8;--gold:#d8b85f;
    --green:#4caf6e;--red:#e05858;--border:rgba(255,255,255,0.1);
    --okbg:rgba(76,175,110,0.14);--badbg:rgba(224,88,88,0.14);
  }
  body{font-family:'DM Sans',sans-serif;background:var(--paper2);color:var(--ink);min-height:100vh}
  body.dark-mode{background:#15161f}
  header{background:var(--blue);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header a{color:#fff;text-decoration:none;font-weight:600;font-size:0.85rem;border:1px solid rgba(255,255,255,0.3);padding:7px 12px;border-radius:7px}
  header .brand{font-family:'Source Serif 4',serif;font-size:1.1rem;font-weight:600}
  main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
  .card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
  .title{font-family:'Source Serif 4',serif;font-size:1.35rem;font-weight:600}
  .sub{color:var(--ink3);font-size:0.85rem;margin-top:4px}
  .tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--paper);color:var(--ink2);font:600 0.85rem 'DM Sans',sans-serif;cursor:pointer}
  .tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .legend,.note,.pending{font-size:0.85rem;color:var(--ink2);background:var(--paper2);border-radius:8px;padding:10px 12px;margin-bottom:12px}
  .q{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-left-width:4px;border-radius:9px;margin-bottom:8px;background:var(--paper)}
  .q.ok{border-left-color:var(--green);background:var(--okbg)}
  .q.bad{border-left-color:var(--red);background:var(--badbg)}
  .qn{font-weight:700;color:var(--ink3);min-width:30px;text-align:right;padding-top:1px}
  .qb{flex:1;min-width:0}
  .qt{font-size:0.9rem;color:var(--ink);margin-bottom:6px;line-height:1.45}
  .ans,.key{font-size:0.88rem;line-height:1.5;word-break:break-word}
  .lbl{display:inline-block;font-size:0.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin-right:8px;min-width:76px}
  .key{margin-top:3px;color:var(--green);font-weight:600}
  .mark{margin-left:8px;font-weight:800}
  .ok .mark{color:var(--green)}.bad .mark{color:var(--red)}
  .blank{color:var(--ink3);font-style:italic}
  .wmeta{font-size:0.82rem;color:var(--ink2);margin:12px 0 6px}
  .wtext{white-space:pre-wrap;background:var(--paper2);border-radius:8px;padding:12px;font-size:0.9rem;line-height:1.6}
  .fb{margin-top:14px;background:rgba(200,168,75,0.12);border:1px solid rgba(200,168,75,0.4);border-radius:8px;padding:12px;font-size:0.9rem;line-height:1.55}
  .scores{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .chip{background:var(--paper2);border-radius:8px;padding:8px 12px;font-size:0.8rem;color:var(--ink2)}
  .chip b{display:block;font-size:1.05rem;color:var(--ink)}
  .msg{text-align:center;padding:40px 16px;color:var(--ink2)}
  .msg .big{font-size:2.2rem;margin-bottom:8px}
  .btn{display:inline-block;margin-top:14px;background:var(--blue);color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600;font-size:0.88rem}
</style>
</head>
<body>
<header>
  <span class="brand">BandUp</span>
  <a href="profile.html">← Back to profile</a>
</header>
<main id="main"><div class="msg"><div class="big">⏳</div>Loading your answers…</div></main>

<script src="bandup-api.js"></script>
<script>
if (localStorage.getItem('ielts_dark_mode') === '1') document.body.classList.add('dark-mode');

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stripTags(s){ return String(s == null ? '' : s).replace(/<br\s*\/?>|<\/p>|<\/li>/gi,' ').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim(); }
function showMsg(icon, text, extra){
  document.getElementById('main').innerHTML = `<div class="card msg"><div class="big">${icon}</div>${text}${extra||''}</div>`;
}

// ── question text, taken from the public test file (best effort — the review works without it) ──
function collect(node, map, depth){
  if (!node || typeof node !== 'object' || depth > 9) return;
  if (Array.isArray(node)) { node.forEach(n => collect(n, map, depth + 1)); return; }
  const set = (n, text, options) => {
    n = Number(n); if (!isFinite(n)) return;
    if (!map[n]) map[n] = { text: text || '', options: options || null };
    else { if (!map[n].text && text) map[n].text = text; if (!map[n].options && options) map[n].options = options; }
  };
  // fill-in-the-blank sentences
  if (Array.isArray(node.fcLines)) node.fcLines.forEach(line => {
    const segs = (line && line.segments) || [];
    const nums = segs.filter(s => s && s.stype === 'blank' && s.num != null).map(s => s.num);
    if (!nums.length) return;
    const text = segs.map(s => s.stype === 'blank' ? '____(' + s.num + ')' : stripTags(s.text || '')).join(' ').replace(/\s+/g,' ').trim();
    nums.forEach(n => set(n, text));
  });
  // matching blocks: numbers[i] ↔ labels[i]
  if (Array.isArray(node.numbers) && Array.isArray(node.labels)) node.numbers.forEach((n, i) => set(n, stripTags(node.labels[i] || '')));
  if (Array.isArray(node.matchItems)) node.matchItems.forEach(it => { if (it && it.num != null) set(it.num, stripTags(it.label || it.text || '')); });
  // shared question text for a range (choose two letters, etc.)
  if (node.qFrom != null && node.qTo != null && node.qText) for (let n = Number(node.qFrom); n <= Number(node.qTo); n++) set(n, stripTags(node.qText));
  // single questions
  const num = node.qNum != null ? node.qNum : node.num;
  const txt = node.qText || node.question || node.q;
  if (num != null && isFinite(Number(num)) && (typeof txt === 'string' || Array.isArray(node.options)))
    set(num, typeof txt === 'string' ? stripTags(txt) : '', Array.isArray(node.options) ? node.options : null);
  Object.keys(node).forEach(k => { if (node[k] && typeof node[k] === 'object') collect(node[k], map, depth + 1); });
}

function optText(q, given){
  if (!q || !q.options || given == null) return '';
  const g = String(given).trim();
  if (g.length !== 1) return '';
  const i = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.indexOf(g.toUpperCase());
  if (i < 0) return '';
  // options can be plain strings ("A. text"), or {text}/{label}; or already keyed by letter
  let o = q.options[i];
  if (o == null) return '';
  if (typeof o === 'object') o = o.text || o.label || '';
  return stripTags(o).replace(/^[A-Za-z][.)]\s+/, '');
}

function row(n, shown, given, ok, keyVal, q, showKey){
  const cls = ok === true ? 'ok' : ok === false ? 'bad' : '';
  const mark = ok === true ? '✓' : ok === false ? '✗' : '';
  const ot = optText(q, given);
  const gtxt = given ? esc(given) + (ot ? ` <span style="color:var(--ink3)">— ${esc(ot)}</span>` : '') : '<span class="blank">No answer</span>';
  let keyHtml = '';
  if (showKey && keyVal && ok !== true) {
    const kot = optText(q, keyVal);
    keyHtml = `<div class="key"><span class="lbl">Correct</span>${esc(keyVal)}${kot ? ` <span style="font-weight:400">— ${esc(kot)}</span>` : ''}</div>`;
  }
  return `<div class="q ${cls}"><div class="qn">${shown}</div><div class="qb">
    ${q && q.text ? `<div class="qt">${esc(q.text)}</div>` : ''}
    <div class="ans"><span class="lbl">Your answer</span>${gtxt}${mark ? `<span class="mark">${mark}</span>` : ''}</div>
    ${keyHtml}</div></div>`;
}

function section(D, which, qmap, offset){
  const answers = D[which + 'Answers'] || {};
  const marks = D[which + 'Marks'] || null;
  const keys = D[which + 'Key'] || null;
  const max = D.maxPerSection || 40;
  let right = 0, html = '';
  for (let n = 1; n <= max; n++) {
    const given = answers[String(n)] == null ? '' : String(answers[String(n)]).trim();
    const ok = marks ? (marks[String(n)] === true ? true : (marks[String(n)] === false ? false : null)) : null;
    if (ok === true) right++;
    html += row(n + offset, n + offset, given, ok, keys ? keys[String(n)] : '', qmap[n + offset], !!keys);
  }
  const head = D.hasKey
    ? `<div class="legend">${right} correct out of ${max}.${D.mode === 'marks' ? ' Your teacher has chosen not to show the correct answers for this test.' : ''}</div>`
    : `<div class="note">This test has no answer key yet, so your answers are shown but not marked.</div>`;
  return head + html;
}

function writingHtml(w){
  if (!w) return '';
  const part = (label, text, wc, band) => `
    <div class="wmeta"><b>${label}</b> · ${wc || 0} words${band ? ` · Band ${esc(band)}` : ''}</div>
    <div class="wtext">${text ? esc(text) : '<span class="blank">Nothing was written.</span>'}</div>`;
  return `<div class="card"><div class="title" style="font-size:1.1rem">✍️ Writing</div>
    ${w.graded
      ? `<div class="sub" style="margin-bottom:6px">Writing band: <b>${esc(w.band || '—')}</b>${w.speakingBand ? ` · Speaking: <b>${esc(w.speakingBand)}</b>` : ''}${w.overall ? ` · Overall: <b>${esc(w.overall)}</b>` : ''}</div>`
      : '<div class="pending">⏳ Not graded yet — your bands and feedback will appear here once your teacher has marked it.</div>'}
    ${part('Task 1', w.task1Text, w.task1WC, w.graded ? w.task1Band : '')}
    ${part('Task 2', w.task2Text, w.task2WC, w.graded ? w.task2Band : '')}
    ${w.graded && w.notes ? `<div class="fb"><b>💬 Examiner feedback</b><br>${esc(w.notes).replace(/\n/g, '<br>')}</div>` : ''}</div>`;
}

let D = null, QL = {}, QR = {}, TAB = 'L';
function render(){
  const isTOEIC = D.examType === 'TOEIC';
  const off = isTOEIC ? 100 : 0;
  const date = D.submittedAt ? new Date(D.submittedAt).toLocaleDateString('en-PH', { year:'numeric', month:'long', day:'numeric' }) : '';
  let body = '';
  if (TAB === 'L') body = section(D, 'listening', QL, 0);
  else if (TAB === 'R') body = section(D, 'reading', QR, off);
  const hdr = `<div class="card">
    <div class="title">${esc(D.testSetName || 'Test')}</div>
    <div class="sub">${esc(date)}${isTOEIC ? ' · TOEIC' : ''}</div>
    <div class="scores">
      <div class="chip"><b>${esc(D.listeningScore)}/${D.maxPerSection}</b>Listening</div>
      <div class="chip"><b>${esc(D.readingScore)}/${D.maxPerSection}</b>Reading</div>
    </div>
    <div class="tabs">
      <button class="tab ${TAB === 'L' ? 'on' : ''}" onclick="TAB='L';render()">🎧 Listening</button>
      <button class="tab ${TAB === 'R' ? 'on' : ''}" onclick="TAB='R';render()">📖 Reading</button>
      ${D.writing ? `<button class="tab ${TAB === 'W' ? 'on' : ''}" onclick="TAB='W';render()">✍️ Writing</button>` : ''}
    </div></div>`;
  document.getElementById('main').innerHTML = hdr + (TAB === 'W' ? writingHtml(D.writing) : body);
  window.scrollTo(0, 0);
}

(async function boot(){
  const raw = sessionStorage.getItem('candidateData');
  if (!raw) { window.location.href = 'index.html'; return; }
  const cd = JSON.parse(raw);
  const sub = new URLSearchParams(location.search).get('sub') || '';
  if (!sub) { showMsg('🤔', 'No attempt was selected.', '<br><a class="btn" href="profile.html">Back to profile</a>'); return; }

  let res;
  try { res = await callSheets({ action:'getAttemptReview', candidateID: cd.candidateID, submissionID: sub }); }
  catch(e) { showMsg('📡', 'Could not reach the server. Please check your connection and try again.', '<br><a class="btn" href="javascript:location.reload()">Try again</a>'); return; }

  if (res && res.sessionInvalid) { sessionStorage.clear(); window.location.href = 'index.html'; return; }
  if (res && res.preview) { showMsg('👀', 'This is an admin preview, so there are no personal answers to review here.', '<br><a class="btn" href="profile.html">Back</a>'); return; }
  if (res && res.reviewOff) { showMsg('🔒', 'Your teacher has turned off answer review for this test.', '<br><a class="btn" href="profile.html">Back to profile</a>'); return; }
  if (!res || !res.success) { showMsg('⚠️', esc((res && res.message) || 'Could not load this attempt.'), '<br><a class="btn" href="profile.html">Back to profile</a>'); return; }
  D = res;
  render();

  // question wording (optional): find this test's file via the test list, then read it
  try {
    const ts = await callSheets({ action:'getTestSets', candidateID: cd.candidateID });
    const set = ((ts && ts.sets) || []).find(s => s.setID === D.testSetID);
    if (set && set.configURL) {
      const cfg = await (await fetch(set.configURL, { cache:'no-store' })).json();
      if (cfg.listening) collect(cfg.listening, QL, 0);
      if (cfg.reading)   collect(cfg.reading,   QR, 0);
      render();
    }
  } catch(e) { /* the answers are already on screen without the question text */ }
})();
</script>
</body>
</html>
